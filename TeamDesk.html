  q("#rk-owner").onchange=e=>{r.owner=e.target.value.trim();touch(r);};
  q("#rk-team").onchange=e=>{r.team=e.target.value;touch(r);renderApp();};
  q("#rk-raised").onchange=e=>{r.raisedOn=e.target.value;touch(r);renderApp();};
  q("#rk-review").onchange=e=>{r.reviewOn=e.target.value;touch(r);renderApp();};
  q("#rk-detail").onchange=e=>{r.detail=e.target.value;touch(r);};
  q("#rk-mit").onchange=e=>{r.mitigation=e.target.value;touch(r);};
  q("#rk-reviewed").onclick=()=>{r.reviewOn=addDays(RISK_REVIEW_DAYS);touch(r);renderApp();toast("Review date pushed out");};
  q("#rk-del").onclick=()=>{if(!confirm("Delete this risk?"))return;
    state.risks=state.risks.filter(x=>x.id!==r.id);activeRiskId=null;markDirty();renderApp();};
  det.querySelectorAll("[data-rtdel]").forEach(c=>c.onclick=()=>{r.ticketIds=r.ticketIds.filter(x=>x!==c.dataset.rtdel);touch(r);renderApp();});
  det.querySelectorAll("[data-redel]").forEach(c=>c.onclick=()=>{r.epicIds=r.epicIds.filter(x=>x!==c.dataset.redel);touch(r);renderApp();});
  const ta=q("#rk-taddsel");if(ta)ta.onchange=e=>{if(e.target.value){r.ticketIds.push(e.target.value);touch(r);renderApp();}};
  const ea=q("#rk-eaddsel");if(ea)ea.onchange=e=>{if(e.target.value){r.epicIds.push(e.target.value);touch(r);renderApp();}};
}

/* ===================== KNOWLEDGE (patterns + contacts) ===================== */
function activePattern(){return state.patterns.find(p=>p.id===activePatternId);}
function activeContact(){return state.contacts.find(c=>c.id===activeContactId);}
function renderKnowledgeSidebar(){
  const side=document.getElementById("side");
  const f=renderKnowledgeSidebar;
  const isPat=knowledgeTab==="patterns",isDec=knowledgeTab==="decisions",isRisk=knowledgeTab==="risks";
  let rks=state.risks.slice().sort((a,b)=>(a.status==="closed"?1:0)-(b.status==="closed"?1:0)||sevRank(a)-sevRank(b)||(a.reviewOn||"9999")<(b.reviewOn||"9999")?-1:1);
  let decs=state.decisions.slice().sort((a,b)=>a.date<b.date?1:-1);
  let pats=state.patterns.slice().sort((a,b)=>b.ticketIds.length-a.ticketIds.length||a.title.localeCompare(b.title));
  let cons=state.contacts.slice().sort((a,b)=>(a.stack||"").localeCompare(b.stack||"")||a.name.localeCompare(b.name));
  if(f._q){const q=f._q.toLowerCase();
    pats=pats.filter(p=>(p.title+" "+p.symptom+" "+p.cause+" "+p.steps+" "+p.tags.join(" ")).toLowerCase().includes(q));
    cons=cons.filter(c=>(c.name+" "+c.stack+" "+c.org+" "+c.note).toLowerCase().includes(q));
    decs=decs.filter(x=>(x.text+" "+x.by).toLowerCase().includes(q));
    rks=rks.filter(x=>(x.title+" "+x.detail+" "+x.owner+" "+x.mitigation).toLowerCase().includes(q));}
  renderDecisionLedger._q=f._q||"";
  if(f._stack)cons=cons.filter(c=>c.stack===f._stack);
  const stacks=distinct(state.contacts.map(c=>c.stack));
  side.innerHTML=`
    <div class="side-tools">
      <div class="segmented">
        <button class="${knowledgeTab==="patterns"?"on":""}" data-kt="patterns">Patterns</button>
        <button class="${knowledgeTab==="contacts"?"on":""}" data-kt="contacts">Contacts</button>
        <button class="${knowledgeTab==="decisions"?"on":""}" data-kt="decisions">Decisions</button>
        <button class="${knowledgeTab==="risks"?"on":""}" data-kt="risks">Risks</button></div>
      <button class="primary" id="kNew" style="width:100%">＋ ${knowledgeTab==="patterns"?"New pattern":knowledgeTab==="contacts"?"New contact":knowledgeTab==="risks"?"New risk":"Log a decision"}</button>
      <input id="kSearch" placeholder="Filter…" value="${esc(f._q||"")}" autocomplete="off">
      ${knowledgeTab==="contacts"&&stacks.length?`<div class="filters"><select id="kStack"><option value="">Any stack</option>
        ${stacks.map(s=>`<option value="${esc(s)}" ${f._stack===s?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`:""}
    </div>
    <div class="stats">
      <div class="stat op"><b>${state.patterns.length}</b>patterns</div>
      <div class="stat dl"><b>${state.tickets.filter(t=>t.resolution).length}</b>resolutions</div>
      <div class="stat"><b>${state.contacts.length}</b>contacts</div>
      <div class="stat"><b>${state.decisions.length}</b>decisions</div>
      <div class="stat ov"><b>${liveRisks().length}</b>live risks</div>
    </div>
    <div class="listwrap">
      ${isRisk?(rks.length?rks.map(r=>`<div class="rcard sev-${r.severity} st-${r.status} ${r.id===activeRiskId?"active":""}" data-rid="${r.id}">
          <div class="rt">${esc(r.title||"(untitled risk)")}</div>
          <div class="rm"><span class="pill ${RISK_SEV[r.severity].cls}">${RISK_SEV[r.severity].label}</span>
            <span>${esc(RISK_STATUS[r.status].label)}</span>
            ${riskNeedsReview(r)?`<span class="revchip">review due</span>`:""}
            ${r.owner?`<span class="faint">${esc(r.owner)}</span>`:""}</div>
        </div>`).join("")
        :`<div class="empty">${f._q?"No risks match.":"No risks logged.<br><br>The things that outlive one ticket — a team that's always slow, an exposure you're carrying. They'd otherwise stay in a meeting note."}</div>`)
      :isDec?(decs.length?decs.slice(0,40).map(x=>`<div class="pcard2" style="border-left-color:var(--teal)" data-did2="${x.id}">
          <div class="p2t" style="font-weight:500;font-size:12.5px">${esc(x.text.slice(0,80))}${x.text.length>80?"…":""}</div>
          <div class="p2m"><span class="mono">${fmtDate(x.date)}</span>${x.by?`<span>by ${esc(x.by)}</span>`:""}</div>
        </div>`).join("")
        :`<div class="empty">${f._q?"No decisions match.":"No decisions logged yet.<br><br>Log them from syncs — the 🧭 button — or from the pane on the right."}</div>`)
      :isPat?(pats.length?pats.map(p=>`<div class="pcard2 ${p.id===activePatternId?"active":""}" data-pid2="${p.id}">
          <div class="p2t">${esc(p.title||"(untitled pattern)")}</div>
          <div class="p2m"><span class="seenbadge">seen ${p.ticketIds.length}×</span>
            ${p.tags.slice(0,3).map(g=>`<span class="pill tag">${esc(g)}</span>`).join("")}</div>
        </div>`).join("")
        :`<div class="empty">${f._q?"No patterns match.":"No patterns yet.<br><br>When you capture a resolution and the same thing shows up again, promote it here — that's how a fix becomes a repeatable process."}</div>`)
      :(cons.length?cons.map(c=>`<div class="ccard ${c.id===activeContactId?"active":""}" data-cid2="${c.id}">
          <div class="p2t">${esc(c.name)}</div>
          <div class="p2m">${c.stack?`<span class="stackchip">${esc(c.stack)}</span>`:""}
            ${c.org?`<span>${esc(c.org)}</span>`:""}
            <span class="faint">${ticketsForContact(c.id).length} ticket${ticketsForContact(c.id).length===1?"":"s"}</span></div>
        </div>`).join("")
        :`<div class="empty">${f._q||f._stack?"No contacts match.":"No contacts yet.<br><br>The people you reach out to for answers on other stacks. Right now that list only lives in your head."}</div>`)}
    </div>`;
  side.querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>{
    knowledgeTab=b.dataset.kt;f._q="";f._stack="";renderApp();});
  side.querySelector("#kNew").onclick=()=>isPat?openPatternModal():isDec?openDecisionModal({}):isRisk?newRisk():openContactModal(null);
  const si=side.querySelector("#kSearch");
  si.oninput=e=>{clearTimeout(si._t);si._t=setTimeout(()=>{f._q=e.target.value;renderKnowledgeSidebar();
    const el=document.getElementById("kSearch");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},200);};
  const ks=side.querySelector("#kStack");if(ks)ks.onchange=e=>{f._stack=e.target.value;renderKnowledgeSidebar();};
  side.querySelectorAll("[data-pid2]").forEach(c=>c.onclick=()=>{activePatternId=c.dataset.pid2;renderApp();});
  side.querySelectorAll("[data-rid]").forEach(c=>c.onclick=()=>{activeRiskId=c.dataset.rid;renderApp();});
  side.querySelectorAll("[data-did2]").forEach(c=>c.onclick=()=>{
    const el=document.getElementById("dec-"+c.dataset.did2);
    if(el){el.scrollIntoView({block:"center",behavior:"smooth"});
      el.style.borderColor="var(--accent)";setTimeout(()=>{el.style.borderColor="";},1200);}});
  side.querySelectorAll("[data-cid2]").forEach(c=>c.onclick=()=>{activeContactId=c.dataset.cid2;renderApp();});
}
function openPatternModal(seedFrom){
  const root=document.getElementById("modalRoot");
  const r=seedFrom&&seedFrom.resolution;
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:560px">
    <h2>${seedFrom?"Promote to a pattern":"New pattern"}</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">${seedFrom?`Seeded from ${esc(seedFrom.ticketId||"this ticket")}. Edit it into the general version — the one that applies next time, not just to this ticket.`:"A problem you've seen more than once, written up once properly."}</p>
    <div class="field"><label>Title</label><input id="pt-t" value="${esc(seedFrom?(seedFrom.title||""):"")}" placeholder="Launchpad tiles blank for a business role" autocomplete="off"></div>
    <div class="field"><label>Symptom</label><textarea id="pt-sym" style="min-height:54px">${esc(r?r.symptom:"")}</textarea></div>
    <div class="field"><label>Root cause</label><textarea id="pt-c" style="min-height:54px">${esc(r?r.cause:"")}</textarea></div>
    <div class="field"><label>Fix</label><textarea id="pt-s" style="min-height:120px">${esc(r?r.steps:"")}</textarea></div>
    <div class="field"><label>Notes</label><textarea id="pt-n" style="min-height:50px">${esc(r?r.notes:"")}</textarea></div>
    <div class="modal-foot"><button id="pt-x" class="ghost">Cancel</button><button id="pt-ok" class="primary">${seedFrom?"Create pattern":"Create"}</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#pt-x").onclick=close;
  root.querySelector("#pt-ok").onclick=()=>{
    const p=normPattern({title:root.querySelector("#pt-t").value.trim(),
      symptom:root.querySelector("#pt-sym").value.trim(),cause:root.querySelector("#pt-c").value.trim(),
      steps:root.querySelector("#pt-s").value.trim(),notes:root.querySelector("#pt-n").value.trim(),
      tags:seedFrom?seedFrom.tags.slice():[],
      ticketIds:seedFrom?[seedFrom.id]:[],
      contactIds:seedFrom?seedFrom.contactIds.slice():[]});
    if(!p.title){toast("Give it a title first",true);return;}
    state.patterns.unshift(p);markDirty();close();
    activePatternId=p.id;knowledgeTab="patterns";view="knowledge";renderApp();
    toast("Pattern created");};
  root.querySelector("#pt-t").focus();
}
function renderKnowledgeDetail(){
  const det=document.getElementById("detail");
  if(knowledgeTab==="patterns")renderPatternDetail(det);
  else if(knowledgeTab==="decisions")renderDecisionLedger(det);
  else if(knowledgeTab==="risks")renderRiskDetail(det);
  else renderContactDetail(det);
}

    :"No patterns yet.<br><br>Capture a resolution on a closed ticket, then promote it here when the same thing recurs.");return;}
  const tks=p.ticketIds.map(ticketByRef).filter(Boolean).sort((a,b)=>(a.closedDate||"")<(b.closedDate||"")?1:-1);

        <span class="di-main">${esc(ticketLabel(t))}</span>
        <span class="di-sub">${t.raisedDate?fmtDate(t.raisedDate):""}${t.resolution&&t.resolution.timeTaken?" · "+esc(t.resolution.timeTaken):""}</span>
        <button class="ghost sm" data-ptunlink="${t.id}" title="Unlink">✕</button></div>`).join("")
        :`<p class="faint" style="font-size:12px">No tickets linked yet.</p>`}

      <div class="sec-title" style="margin-top:22px"><h3>Who to ask</h3><div class="ln"></div></div>
      <div class="chiprow">
        ${p.contactIds.map(id=>{const c=contactById(id);
          return `<span class="chip" data-pcdel="${esc(id)}">${esc(c?c.name:"?")}${c&&c.stack?` <span class="faint">· ${esc(c.stack)}</span>`:""} <span class="x">✕</span></span>`;}).join("")}
        ${state.contacts.length?`<select id="pt2-cadd" style="width:auto;padding:3px 9px"><option value="">+ link a contact</option>

  q("#pt2-c").onchange=e=>{p.cause=e.target.value;touch(p);};

      root.querySelectorAll("[data-emhrs]").forEach(inp=>rows[+inp.dataset.emhrs].hours=inp.value);
      rows.push({ticketId:"",hours:"",note:""});draw();};
    root.querySelector("#em-x").onclick=()=>root.innerHTML="";
    root.querySelector("#em-ok").onclick=()=>{
      root.querySelectorAll("[data-emhrs]").forEach(inp=>rows[+inp.dataset.emhrs].hours=inp.value);
      root.querySelectorAll("[data-emnote]").forEach(inp=>rows[+inp.dataset.emnote].note=inp.value);

function weeksBack(n){

  const thisMon=new Date(now.getTime()-dow*86400000);
  for(let i=n-1;i>=0;i--){
    const st=new Date(thisMon.getTime()-i*7*86400000);
    out.push({start:dstr(st),end:dstr(new Date(st.getTime()+6*86400000)),
      label:dstr(st).slice(5).replace("-","/")});
  }

function medianOf(a){if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;
  return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}

  if(!t.closedDate||!t.raisedDate)return null;
  const d=Math.round((new Date(t.closedDate+"T00:00:00")-new Date(t.raisedDate+"T00:00:00"))/86400000);
  return d>=0?d:null;
}
function insightsData(weeks){
  const teams=state.settings.teams;
  const S=teams.map(tm=>({key:tm.id,label:tm.name,color:teamChartColor(tm.id)}));
  /* 1 — throughput */
  const wk=weeksBack(weeks);
  const throughput=wk.map(w=>{const row={label:w.label};
    teams.forEach(tm=>{row[tm.id]=state.tickets.filter(t=>t.team===tm.id&&t.closedDate&&t.closedDate>=w.start&&t.closedDate<=w.end).length;});
    return row;});
  /* 2 — ageing of open work */
  const buckets=[["≤ 7 days",0,7],["8–14 days",8,14],["15–30 days",15,30],["over 30 days",31,1e9]];
  const ageing=buckets.map(([label,lo,hi])=>{const row={label};
    teams.forEach(tm=>{row[tm.id]=state.tickets.filter(t=>t.team===tm.id&&isOpen(t)&&t.raisedDate&&(()=>{
      const a=Math.max(0,-daysUntil(t.raisedDate));return a>=lo&&a<=hi;})()).length;});
    return row;});
  /* 3 — where delays come from (total days blocked per hurdle kind) */
  const delay={};
  state.tickets.forEach(t=>t.hurdles.forEach(h=>{
    const end=h.resolvedOn||todayStr();
    const d=Math.max(0,Math.round((new Date(end+"T00:00:00")-new Date(h.raisedOn+"T00:00:00"))/86400000));
    const k=HURDLE_KINDS[h.kind].label;
    delay[k]=delay[k]||{days:0,n:0};delay[k].days+=d;delay[k].n++;}));
  const delays=Object.entries(delay).map(([label,v])=>({label,v:v.days,n:v.n}))
    .sort((a,b)=>b.v-a.v);
  /* 4 — cycle time by tag (median days raised→closed) */
  const byTag={};
  state.tickets.forEach(t=>{const c=cycleDays(t);if(c===null)return;
    t.tags.forEach(g=>{(byTag[g]=byTag[g]||[]).push(c);});});
  const cycle=Object.entries(byTag).map(([label,arr])=>({label,v:medianOf(arr),n:arr.length}))
    .sort((a,b)=>b.v-a.v).slice(0,8);
  /* 5 — current load */
  const load=state.people.map(p=>({label:p.name,v:openLoad(p.id),team:p.team}))
    .filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  /* 6 — commitment reliability: slip bands per team */
  const rel=teams.map(tm=>{
    const ts=state.tickets.filter(t=>t.team===tm.id&&t.promises.length);
    return {label:tm.name,b0:ts.filter(t=>slipCount(t)===0).length,
      b1:ts.filter(t=>slipCount(t)===1).length,b2:ts.filter(t=>slipCount(t)>=2).length};
  }).filter(r=>r.b0+r.b1+r.b2>0);
  /* 7 — conduct: which KIND of failure each team has.
     Deliberately the cross-team cut. The Performance tab's Patterns view goes deep
     on one team; what Insights adds is the comparison and the trend. */
  const AREA_ORDER=["Communication","Commitment","Quality","Analysis","Effort","Process","Impact"];
  const areas=AREA_ORDER.map(g=>{const row={label:g};
    teams.forEach(tm=>{row[tm.id]=state.incidents.filter(x=>x.team===tm.id
      &&x.kinds.some(k=>FAIL_KINDS[k]&&FAIL_KINDS[k].group===g)).length;});
    return row;}).filter(r=>teams.some(tm=>r[tm.id]>0));
  /* 8 — conduct over time: is it getting better or worse? */
  const im={};
  state.incidents.forEach(x=>{const m=(x.date||"").slice(0,7);if(!m)return;
    (im[m]=im[m]||{})[x.team]=(im[m][x.team]||0)+1;});
  const incMonths=Object.keys(im).sort().map(m=>{const row={label:monthLabel(m).slice(0,3)};
    teams.forEach(tm=>{row[tm.id]=im[m][tm.id]||0;});return row;});
  /* headline stat tiles */
  const open=state.tickets.filter(isOpen);
  const closed=state.tickets.filter(t=>cycleDays(t)!==null);
  const withP=state.tickets.filter(t=>t.promises.length);
  return {S,throughput,ageing,delays,cycle,load,rel,wk,areas,incMonths,
    hasIncidents:state.incidents.length>0,
    kpi:{open:open.length,blocked:open.filter(t=>openHurdles(t).length).length,
      median:closed.length?medianOf(closed.map(cycleDays)):null,
      onTime:withP.length?Math.round(withP.filter(t=>slipCount(t)===0).length/withP.length*100):null,
      failDays:state.incidents.reduce((a,x)=>a+num(x.costDays),0),
      incidents:state.incidents.length}};
}

/* hover/focus tooltip — an SVG chart should be interactive, not a static picture */
function wireChartTips(root){

  if(!tip){tip=document.createElement("div");tip.id="chtip";tip.className="chtip";document.body.appendChild(tip);}
  const show=(el,e)=>{
    tip.textContent=el.dataset.tip;tip.classList.add("on");
    const r=el.getBoundingClientRect();
    const x=(e&&e.clientX!=null?e.clientX:r.left+r.width/2),y=r.top;
    tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-8,Math.max(8,x-tip.offsetWidth/2))+"px";
    tip.style.top=Math.max(6,y-tip.offsetHeight-9)+"px";
  };
  const hide=()=>tip.classList.remove("on");
  root.querySelectorAll("[data-tip]").forEach(el=>{
    el.onmouseenter=e=>show(el,e);el.onmousemove=e=>show(el,e);
    el.onmouseleave=hide;el.onfocus=()=>show(el);el.onblur=hide;});

/* ===================== CHART PRIMITIVES =====================
   Hand-rolled SVG — no CDN, offline. Magnitude is carried by bar LENGTH, so those
   charts stay one hue; colour is only spent where the job is telling series apart. */
const CH={pad:{l:104,r:16,t:10,b:26},barH:17,gap:9,grpGap:5};
function chAxis(w,h,ticks,fmt){
  return ticks.map(t=>`<g><line x1="${t.x}" y1="${CH.pad.t}" x2="${t.x}" y2="${h-CH.pad.b}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${t.x}" y="${h-CH.pad.b+15}" fill="var(--faint)" font-size="10" text-anchor="middle" style="font-variant-numeric:tabular-nums">${esc(fmt?fmt(t.v):t.v)}</text></g>`).join("");

/* `intOnly` keeps counts on whole-number ticks — an axis reading 0 / 0.5 / 1 for

function niceTicks(max,n,intOnly){
  if(max<=0)return [0];
  const raw=max/(n||4),mag=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;
  if(intOnly)step=Math.max(1,Math.round(step));
  /* Floor the axis at 4 for small counts. Without it a single ticket draws a
     full-width bar, which reads as "maxed out" when it means "one". The axis is
     labelled either way, so this is legibility, not flattery. */
  const top=(intOnly&&max<4)?4:max;
  const out=[];for(let v=0;v<=top+step*0.001;v+=step)out.push(+v.toFixed(6));
  if(out[out.length-1]<top)out.push(+(out[out.length-1]+step).toFixed(6));
  return out;
}

  const nAppr=Math.round(r.approved/perCell), nPend=Math.round(r.pending/perCell);
  const w=COLS*9+8,h=ROWS*9+8;

    else if(i<nAppr+nPend)cells+=`<circle cx="${cx}" cy="${cy}" r="1.9" fill="none" stroke="var(--amber)" stroke-width="1.1"/>`;

  const rawMax=Math.max(1,...vals);

     maxed out". The floor of 4 stops a single-item chart filling its track. */

function chBarsH(rows,opts){

/* vertical grouped columns over time */
function chCols(cats,series,opts){
  const o=Object.assign({w:560,h:190,fmt:v=>v,unit:""},opts||{});
  if(isInstrument())return chDotCols(cats,series,o);
  const pl=34,pr=10,pt=10,pb=30;
  const plotW=o.w-pl-pr,plotH=o.h-pt-pb;
  const cvals=cats.flatMap(c=>series.map(s=>+c[s.key]||0));
  const max=Math.max(1,...cvals);
  const ticks=niceTicks(max,3,allInts(cvals)),top=ticks[ticks.length-1]||1;
  const bandW=plotW/(cats.length||1);
  const bw=Math.max(4,Math.min(15,(bandW-6)/series.length-2));
  const y=v=>pt+plotH-(v/top)*plotH;
  return `<svg viewBox="0 0 ${o.w} ${o.h}" width="100%" height="${o.h}" role="img">
    ${ticks.map(v=>`<g><line x1="${pl}" y1="${y(v)}" x2="${o.w-pr}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${pl-6}" y="${y(v)+3.5}" fill="var(--faint)" font-size="10" text-anchor="end" style="font-variant-numeric:tabular-nums">${v}</text></g>`).join("")}
    ${cats.map((c,i)=>{
      const cx=pl+i*bandW+bandW/2;
      const totalW=series.length*bw+(series.length-1)*2;
      return series.map((s,si)=>{
        const v=+c[s.key]||0;if(v<=0)return "";
        const bx=cx-totalW/2+si*(bw+2),bh=Math.max(2,plotH-(y(v)-pt));
        return `<g class="chbar" tabindex="0" data-tip="${esc(s.label+" · "+c.label+": "+o.fmt(v)+o.unit)}">
          <rect x="${bx}" y="${y(v)}" width="${bw}" height="${bh}" rx="3" fill="${s.color}"/></g>`;}).join("")
        +(i%Math.ceil(cats.length/6||1)===0?`<text x="${cx}" y="${o.h-9}" fill="var(--faint)" font-size="9.5" text-anchor="middle">${esc(c.label)}</text>`:"");
    }).join("")}
    <line x1="${pl}" y1="${pt+plotH}" x2="${o.w-pr}" y2="${pt+plotH}" stroke="var(--axis)" stroke-width="1"/></svg>`;
}
/* 100% stacked bar, one row per category — ordered bands (ordinal ramp) */

          ${sw>30?`<text x="${x0+sw/2-1}" y="${y+rowH-6}" fill="#ffffff" stroke="rgba(0,0,0,.4)" stroke-width="2.6" paint-order="stroke" font-size="10.5" font-weight="700" text-anchor="middle">${pct}%</text>`:""}</g>`;}).join("");
      return `<text x="${CH.pad.l-9}" y="${y+rowH-6}" fill="var(--muted)" font-size="11.5" text-anchor="end">${esc(String(r.label).slice(0,18))}</text>`+segs
        +`<text x="${o.w-CH.pad.r}" y="${y+rowH-6}" fill="var(--faint)" font-size="10" text-anchor="end">n=${total}</text>`;

/* ===================== BOSS BRIEF =====================
   His real recurring deliverable. Structured per-epic first, then loose tickets,
   because that's the shape the conversation with his boss actually takes. */
function briefData(sinceDate){
  const since=sinceDate||"1970-01-01";
  const sinceTs=new Date(since+"T00:00:00").getTime();
  const changedSince=t=>
    (t.closedDate&&t.closedDate>=since)||
    (t.createdAt>=sinceTs)||
    t.updates.some(u=>u.ts>=sinceTs)||
    t.promises.some(p=>p.givenOn>=since)||
    t.hurdles.some(h=>h.raisedOn>=since||(h.resolvedOn&&h.resolvedOn>=since));
  const epics=state.epics.filter(e=>!e.closed).map(e=>{
    const s=epicSignals(e);
    return {e,s,
      closed:s.ts.filter(t=>t.closedDate&&t.closedDate>=since),
      hurdles:s.blocked.flatMap(t=>openHurdles(t).map(h=>({t,h})))};
  }).sort((a,b)=>HEALTH_ORDER.indexOf(b.e.health)-HEALTH_ORDER.indexOf(a.e.health));
  const loose=state.tickets.filter(t=>!t.epicId);
  const byTeam=state.settings.teams.map(tm=>{
    const all=loose.filter(t=>t.team===tm.id);
    return {tm,open:all.filter(isOpen),closed:all.filter(t=>t.closedDate&&t.closedDate>=since),
      boss:all.filter(t=>t.bossRelevant&&isOpen(t))};
  }).filter(x=>x.open.length||x.closed.length);
  /* decisions he needs FROM his boss — the asks, not the status */
  const decisions=state.tickets.flatMap(t=>openHurdles(t).filter(h=>h.kind==="decision").map(h=>({t,h})));
  const risks=state.tickets.filter(t=>isOpen(t)&&(promiseMissed(t)||slipCount(t)>=2));
  /* decisions taken in the period — the institutional-memory section */
  const taken=state.decisions.filter(x=>x.date>=since).sort((a,b)=>a.date<b.date?1:-1);
  /* forward look: what the current ETAs say lands in the next 14 days, tinted by
     how trustworthy each ticket's promises have been so far */
  const landing=state.tickets.filter(isOpen).map(t=>{
    const lp=latestPromise(t);const eta=(lp&&lp.eta)||t.dueDate;
    if(!eta)return null;const d=daysUntil(eta);
    return (d!==null&&d<=14)?{t,eta,late:d<0,slips:slipCount(t)}:null;
  }).filter(Boolean).sort((a,b)=>a.eta<b.eta?-1:1);
  /* observations are excluded unless he unlocked one individually */
  const obs=state.people.flatMap(p=>p.observations.filter(o=>o.includeInBrief&&o.date>=since).map(o=>({p,o})));
  /* vendor effort — current quarter rollup + forward forecast signal per outsourced team */
  const vendorEffort=vendorTeams().map(tm=>{const q=curQuarter();
    return {team:tm,q,r:quarterRollup(tm.id,q),sig:forecastSignal(tm.id),
      pendAppr:state.approvals.filter(a=>a.team===tm.id&&a.status==="pending").length};});
  const register=liveRisks().sort((a,b)=>sevRank(a)-sevRank(b));
  return {since,epics,byTeam,decisions,taken,landing,risks,register,obs,vendorEffort,
    changed:state.tickets.filter(changedSince),
    closedAll:state.tickets.filter(t=>t.closedDate&&t.closedDate>=since)};
}

    H.push(`<h3>People notes</h3><ul>${d.obs.map(({p,o})=>`<li><b>${esc(p.name)}</b> <i>(${fmtDate(o.date)}, ${OBS_KINDS[o.kind].label.toLowerCase()})</i>: ${esc(o.text)}</li>`).join("")}</ul>`);
  return H.join("");
}
function openBossBrief(){

  const root=document.getElementById("modalRoot");

    root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:860px">
      <h2>👔 Boss brief</h2>

          .map(([k,l])=>`<span class="chip ${opts[k]?"on":""}" data-opt="${k}" style="${opts[k]?"border-color:var(--accent);color:var(--txt)":"opacity:.55"}">${opts[k]?"✓":"○"} ${l}</span>`).join("")}
      </div>
      ${opts.obs?`<div class="banner" style="margin-bottom:12px">🔓 <b>People notes are included.</b> ${d.obs.length} unlocked observation${d.obs.length===1?"":"s"} will appear${lockedOut?` · ${lockedOut} stay${lockedOut===1?"s":""} locked out`:""}.</div>`
        :(lockedOut?`<p class="faint" style="font-size:11.5px;margin:-4px 0 12px">🔒 ${lockedOut} observation${lockedOut===1?"":"s"} held back — People notes is off, and locked observations never export even when it's on.</p>`:"")}

        <button id="bb-md">📋 Copy Markdown</button>
        <button id="bb-dl">⬇ .md</button>
        <button id="bb-print" class="primary">🖨 Print / PDF</button></div>
    </div></div>`;
    root.querySelector("#bb-since").onchange=e=>{since=e.target.value;draw();};
    root.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{
      since=b.dataset.per==="all"?"1970-01-01":addDays(-(+b.dataset.per));draw();});
    root.querySelectorAll("[data-opt]").forEach(c=>c.onclick=()=>{opts[c.dataset.opt]=!opts[c.dataset.opt];draw();});
    root.querySelector("#bb-x").onclick=()=>{root.innerHTML="";};
    root.querySelector("#bb-md").onclick=()=>{
      const md=briefMarkdown(d,opts);
      navigator.clipboard.writeText(md).then(()=>toast("Markdown copied")).catch(()=>toast("Copy blocked — use ⬇ .md",true));
      S.lastBriefOn=todayStr();markDirty();};
    root.querySelector("#bb-dl").onclick=()=>{
      const b=new Blob([briefMarkdown(d,opts)],{type:"text/markdown"});
      const a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download="status-brief-"+todayStr()+".md";a.click();URL.revokeObjectURL(a.href);
      S.lastBriefOn=todayStr();markDirty();toast("Downloaded");};

function runGlobalSearch(qraw){
  const box=document.getElementById("gsearchResults");
  const q=String(qraw||"").trim().toLowerCase();
  if(q.length<2){box.classList.add("hide");return;}
  const hits=[];
  const push=(k,label,sub,go)=>{if(hits.length<40)hits.push({k,label,sub,go});};
  state.tickets.forEach(t=>{
    const hay=[t.ticketId,t.title,t.description,t.tags.join(" "),t.theirStatus,t.evidence,
      t.gates?t.gates.steps.map(g=>g.text).join(" "):"",
      t.subtasks.map(x=>x.title+" "+x.note).join(" "),
      t.updates.map(u=>u.text).join(" "),t.hurdles.map(h=>h.text+" "+h.resolution).join(" "),
      t.objects.map(o=>o.name+" "+o.note).join(" "),t.bossNote,
      t.resolution?[t.resolution.symptom,t.resolution.cause,t.resolution.steps,t.resolution.notes].join(" "):""
    ].join(" ").toLowerCase();
    if(hay.includes(q))push("Ticket",ticketLabel(t),teamOf(t.team).name+" · "+MY_STATUS[t.myStatus].label,()=>gotoTicket(t.id));
  });
  state.people.forEach(p=>{
    if((p.name+" "+p.role+" "+p.note).toLowerCase().includes(q))
      push("Person",p.name,p.role||teamOf(p.team).name,()=>{activePersonId=p.id;view="people";renderApp();});});
  state.contacts.forEach(c=>{
    if((c.name+" "+c.stack+" "+c.org+" "+c.note).toLowerCase().includes(q))
      push("Contact",c.name,c.stack||c.org,()=>{activeContactId=c.id;knowledgeTab="contacts";view="knowledge";renderApp();});});
  state.decisions.forEach(x=>{
    if((x.text+" "+x.by).toLowerCase().includes(q))
      push("Decision",x.text.slice(0,70),x.date+(x.by?" · "+x.by:""),
        ()=>{knowledgeTab="decisions";view="knowledge";renderApp();
          setTimeout(()=>{const el=document.getElementById("dec-"+x.id);if(el)el.scrollIntoView({block:"center"});},60);});});
  state.people.forEach(p=>p.talkingPoints.forEach(tp=>{
    if(tp.text.toLowerCase().includes(q))
      push("Talking point",p.name+" — "+tp.text.slice(0,50),tp.done?"raised "+tp.doneOn:"open",
        ()=>{activePersonId=p.id;peopleMatrix=false;view="people";renderApp();});}));
  state.agenda.forEach(a=>{
    if(a.text.toLowerCase().includes(q))
      push("Agenda",a.text.slice(0,60),teamOf(a.team).name+(a.done?" · raised":" · to raise"),
        ()=>{view="sync";activeSyncId=null;syncFocusId=null;renderApp();});});
  state.patterns.forEach(p=>{
    if([p.title,p.symptom,p.cause,p.steps,p.notes,p.tags.join(" ")].join(" ").toLowerCase().includes(q))
      push("Pattern",p.title,"seen "+p.ticketIds.length+"×",
        ()=>{activePatternId=p.id;knowledgeTab="patterns";view="knowledge";renderApp();});});
  state.epics.forEach(e=>{
    if([e.name,e.code,e.description,e.notes,e.owner,e.headline.text].join(" ").toLowerCase().includes(q))
      push("Epic",e.name,EPIC_HEALTH[e.health].label+" · "+ticketsForEpic(e.id).length+" tickets",
        ()=>{activeEpicId=e.id;view="epics";renderApp();});});
  state.people.forEach(p=>p.observations.forEach(o=>{
    if((o.text+" "+o.source).toLowerCase().includes(q))
      push("Observation",p.name+" — "+o.text.slice(0,60),OBS_KINDS[o.kind].label+" · "+o.date,
        ()=>{activePersonId=p.id;peopleMatrix=false;view="people";renderApp();});}));
  state.syncs.forEach(s=>{
    const hay=[s.title,s.attendees,s.notes,s.points.map(p=>p.text+" "+p.by).join(" "),
      s.actions.map(a=>a.text+" "+a.owner+" "+a.resolution).join(" ")].join(" ").toLowerCase();
    if(hay.includes(q))push("Sync",s.title||teamOf(s.team).name,s.date,()=>{activeSyncId=s.id;activeMeetingId=null;syncFocusId=null;view="sync";renderApp();});});
  state.meetings.forEach(m=>{
    const hay=[m.title,m.attendees,m.notes,m.points.map(p=>p.text+" "+p.by).join(" "),
      m.actions.map(a=>a.text+" "+a.owner+" "+a.resolution).join(" ")].join(" ").toLowerCase();
    if(hay.includes(q))push("Meeting",m.title||MEETING_KINDS[m.kind].label,MEETING_KINDS[m.kind].label+" · "+m.date,
      ()=>{activeMeetingId=m.id;activeSyncId=null;syncFocusId=null;view="sync";renderApp();});});
  state.incidents.forEach(x=>{
    const hay=[x.title,x.narrative,x.inference,x.vendorResponse,
      x.kinds.map(k=>FAIL_KINDS[k].label).join(" "),
      x.evidence.map(e=>e.text+" "+e.source).join(" "),
      x.timeline.map(t=>t.what+" "+t.who).join(" ")].join(" ").toLowerCase();
    if(hay.includes(q))push("Incident",x.title||"(untitled)",
      fmtDate(x.date)+(x.team?" · "+teamOf(x.team).name:""),
      ()=>{activeIncidentId=x.id;perfView="log";view="perf";renderApp();});});
  state.risks.forEach(r=>{
    if((r.title+" "+r.detail+" "+r.owner+" "+r.mitigation).toLowerCase().includes(q))
      push("Risk",r.title||"(untitled)",RISK_SEV[r.severity].label+" · "+RISK_STATUS[r.status].label,
        ()=>{activeRiskId=r.id;knowledgeTab="risks";view="knowledge";renderApp();});});
  state.approvals.forEach(a=>{const t=a.ticketId?ticketByRef(a.ticketId):null;
    if((a.title+" "+a.note+" "+(t?t.ticketId:"")).toLowerCase().includes(q))
      push("Approval",a.title||APPROVAL_KINDS[a.kind].label,APPROVAL_KINDS[a.kind].label+" · "+a.status,
        ()=>{effortTeam=a.team;effortTab="approvals";view="effort";renderApp();});});

  box.innerHTML=hits.length?hits.map((h,i)=>`<div class="gsr" data-i="${i}"><span class="k">${h.k}</span>${esc(h.label)}
    <span class="faint"> — ${esc(h.sub||"")}</span></div>`).join(""):`<div class="gsr faint">No matches.</div>`;
  box.classList.remove("hide");
  box.querySelectorAll(".gsr[data-i]").forEach(d=>d.onmousedown=e=>{e.preventDefault();
    box.classList.add("hide");document.getElementById("globalSearch").value="";hits[+d.dataset.i].go();});
}

async function setMasterPassword(){
  const old=masterPassword;
  if(state.settings.encryption){
    const choice=confirm("OK = change the password.\nCancel = remove encryption entirely.");
    if(choice){
      const pw=await promptPassword("New master password",true);if(pw===null)return;
      masterPassword=pw;await recryptSnapshots(old,pw);markDirty();renderApp();toast("Password changed 🔒");
    }else{
      if(!confirm("Remove encryption? The file will be saved as plain readable JSON."))return;
      state.settings.encryption=false;await recryptSnapshots(old,null);masterPassword=null;markDirty();renderApp();toast("Encryption removed");
    }
    return;
  }
  const pw=await promptPassword("Set a master password",true);if(pw===null)return;
  state.settings.encryption=true;masterPassword=pw;
  await recryptSnapshots(null,pw);
  markDirty();renderApp();
  toast("Encrypted 🔒 — there is no recovery if you lose this password");
}
async function openSnapshots(){
  const arr=(await getSnapshots()).slice().reverse();
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal"><h2>Daily snapshots</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">Taken automatically on the first save of each day. Last 14 kept.</p>
    ${arr.length?`<div class="picklist">${arr.map((s,i)=>`<div class="pickrow" data-i="${i}">
      <span class="tid">${fmtDate(s.date)}</span><span style="flex:1">${s.enc?"🔒 encrypted":"plain"}</span>
      <span class="faint">${(s.data.length/1024).toFixed(1)} KB</span></div>`).join("")}</div>`
      :`<p class="faint">No snapshots yet.</p>`}
    <div class="modal-foot"><button id="sn-x" class="primary">Close</button></div></div></div>`;
  root.querySelector("#sn-x").onclick=()=>root.innerHTML="";
  root.querySelectorAll(".pickrow").forEach(r=>r.onclick=async()=>{
    const s=arr[+r.dataset.i];
    if(!confirm("Restore the snapshot from "+s.date+"?\n\nYour current data will be replaced (it stays in the file until you save)."))return;
    try{
      if(s.enc){const pw=await promptPassword("Snapshot is encrypted — password");if(pw===null)return;
        state=migrate(await decryptEnvelope(JSON.parse(s.data),pw));masterPassword=pw;}
      else state=migrate(JSON.parse(s.data));
      activeId=activeSyncId=syncFocusId=activeMeetingId=activePersonId=activeEpicId=activePatternId=activeContactId=activeRiskId=activeIncidentId=null;
      dirty=true;markDirty();root.innerHTML="";renderApp();toast("Restored snapshot "+s.date);
    }catch(e){toast("Couldn't restore: "+e.message,true);}
  });
}

   A native <input type="date"> always renders in the BROWSER's locale — mm/dd/yyyy on
   this en-US machine — and neither the `lang` attribute nor CSS can reorder it (both
   verified). So mask the native text and paint a dd-mm-yyyy label over it. The input
   element is never replaced: .value stays ISO, every existing onchange handler keeps
   working, and the calendar picker is still there. */
function enhanceDateFields(){
  document.querySelectorAll('input[type="date"]:not([data-dmy])').forEach(inp=>{
    inp.setAttribute("data-dmy","1");
    const w=document.createElement("span");
    /* carry the input's classes so flex sizing (e.g. .du in action rows) still lands */
    w.className="dwrap"+(inp.className?" "+inp.className:"");
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const lab=document.createElement("span");lab.className="dlabel";w.appendChild(lab);
    const sync=()=>{const v=inp.value;lab.textContent=v?fmtDate(v):"dd-mm-yyyy";lab.classList.toggle("ph",!v);};
    inp.addEventListener("input",sync);inp.addEventListener("change",sync);
    sync();
  });
}
/* renders happen constantly (and modals live outside renderApp), so watch the DOM
   rather than trying to call this from every render site */
let dmyQueued=false;
new MutationObserver(()=>{if(dmyQueued)return;dmyQueued=true;
  requestAnimationFrame(()=>{dmyQueued=false;enhanceDateFields();});})
  .observe(document.body,{childList:true,subtree:true});
enhanceDateFields();

const IDLE_MS=15*60*1000;
let lastActivity=Date.now(),screenLocked=false;
["mousemove","keydown","mousedown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastActivity=Date.now();},{passive:true}));
setInterval(()=>{if(!screenLocked&&isEncrypted()&&Date.now()-lastActivity>IDLE_MS)lockScreen();},30000);
function lockScreen(){
  if(screenLocked)return;screenLocked=true;
  const veil=document.createElement("div");veil.className="lockveil";
  veil.innerHTML=`<div class="modal" style="width:360px"><h2>🔒 Locked (idle)</h2>
    <p class="faint" style="font-size:12px">Locked after 15 minutes of inactivity. Nothing was lost — unsaved changes are kept.</p>
    <div class="field"><label>Master password</label><input type="password" id="lk-pw" autocomplete="off"></div>
    <div id="lk-err" style="color:var(--red);font-size:12px;min-height:14px"></div>
    <div class="modal-foot"><button id="lk-ok" class="primary" style="width:100%">Unlock</button></div></div>`;
  document.body.appendChild(veil);
  const pw=veil.querySelector("#lk-pw");pw.focus();
  const tryUnlock=()=>{if(pw.value===masterPassword){veil.remove();screenLocked=false;lastActivity=Date.now();renderApp();}
    else{veil.querySelector("#lk-err").textContent="Wrong password.";pw.value="";pw.focus();}};
  veil.querySelector("#lk-ok").onclick=tryUnlock;
  pw.onkeydown=e=>{if(e.key==="Enter")tryUnlock();};
}
async function unlockStartup(){
  while(true){const pw=await promptPassword("🔒 Enter master password to unlock Team Desk");
    if(pw===null){document.getElementById("detail").innerHTML=nopick("🔒 Locked. <button class='sm' id='retry' style='margin-top:10px'>Unlock</button>");
      const r=document.getElementById("retry");if(r)r.onclick=unlockStartup;return;}
    try{state=migrate(await decryptEnvelope(pendingEncrypted,pw));masterPassword=pw;pendingEncrypted=null;renderApp();toast("Unlocked 🔒");return;}
    catch(e){toast("Wrong password — try again",true);}}
}

async function boot(){
  await initStore();
  const res=await loadBackup();
  if(res==="encrypted"){ renderApp(); await unlockStartup(); }
  else {
    if(!res){ state=emptyState(); }
    renderApp();
    let hadFile=false;try{hadFile=useIdb?!!(await idbGet("hadfile")):!!localStorage.getItem(LS_HANDLE_HINT);}catch(e){}
    if(res&&hadFile)toast("Loaded from local backup");
  }
  await restoreHandle();
}
boot();
