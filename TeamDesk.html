<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Desk — Two-Team Ticket &amp; Knowledge Tracker</title>
<style>
  /* ============================================================
     THEME — every colour is a variable so the whole app flips by
     redefining these under [data-theme="light"]. No render logic
     reads a colour; it only emits var(--x), so the toggle touches
     nothing but this block. The document "paper" surfaces
     (.specpaper/.briefdoc) are intentionally light in BOTH themes.
     ============================================================ */
  :root{
    color-scheme:dark;
    --bg:#0f1216; --bg2:#161b22; --panel:#1b222c; --panel2:#212a36;
    --line:#2b3543; --line2:#374454;
    --txt:#e6edf3; --muted:#8b97a7; --faint:#5b6675;
    --accent:#4ea1ff; --accent2:#a97cff;
    --green:#3fb950; --amber:#d29922; --red:#f85149; --teal:#2dd4bf;
    --chip:#243040;
    --on-accent:#06121f;   /* ink on saturated fills — buttons, active nav, badges */
    --err-ink:#ffb4ae;     /* error text on the toast */
    /* status tints — dark washes; each has a pale light-mode counterpart below */
    --tint-amber-bd:#5a4a1e; --tint-amber-bg:#2a2410;
    --tint-red-bd:#5e2a2a;   --tint-red-bg:#2a1416;
    --tint-green-bd:#274b2c; --tint-green-bg:#142a1a;
    --tint-blue-bd:#274b6e;  --tint-teal-bd:#1f4a45;
    --tint-violet-bd:#4a3a6b; --tint-pnc-bd:#5e2f45;
    /* gradient feature boxes (nextcall / headline / sugg / lookwrap) */
    --grad-blue:linear-gradient(180deg,#16283a,#1a2430);
    --grad-violet:linear-gradient(180deg,#211c2c,#1a2430);
    --grad-amber:linear-gradient(180deg,#2a2410,#1c2230);
    --radius:9px; --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;

    /* ---- team identity + chart palette ----
       Validated as a categorical pair against the dark card surface (#1b222c):
       CVD ΔE 15.9 protan / 30.5 tritan, normal-vision ΔE 26.5, both ≥3:1 contrast.
       The previous pair (blue #4ea1ff + violet #a97cff) measured ΔE 1.1 under
       deuteranopia — indistinguishable — so team colour is no longer left to
       carry identity alone anywhere: every card also names its team. */
    --team-portal:#3987e5;
    --team-pnc:#d55181;
    /* single hue for magnitude bars — length carries the value, not colour */
    --chart-bar:#3987e5;
    /* ordered 3-step ramp for slip bands (validated ordinal: monotone L, gaps ≥.06) */
    --ord-1:#86b6ef; --ord-2:#3987e5; --ord-3:#1c5cab;
    --grid:#2c3542; --axis:#3c4756;
  }
  /* ---- LIGHT THEME ----
     Surfaces invert (elevated = brighter → white cards on a grey plane); hues
     are deepened so they stay legible as text on white and carry white ink as
     fills. Chart hues re-validated against a WHITE surface, not flipped:
     team pair #2a78d6/#c1367a (CVD ΔE 15.9), ordinal #6da7ec/#2a78d6/#16457e. */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#eef1f6; --bg2:#e6eaf1; --panel:#ffffff; --panel2:#eff3f8;
    --line:#dde2ea; --line2:#c8d0dc;
    --txt:#1a2230; --muted:#586170; --faint:#6e7784;
    --accent:#1668c4; --accent2:#6a3fce;
    --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --teal:#0f766e;
    --chip:#eef2f8;
    --on-accent:#ffffff;
    --err-ink:#b3261e;
    --tint-amber-bd:#e6cf93; --tint-amber-bg:#fdf6e3;
    --tint-red-bd:#f0b4b4;   --tint-red-bg:#fdeeee;
    --tint-green-bd:#a8d5b5; --tint-green-bg:#eef8f1;
    --tint-blue-bd:#b3d0ef;  --tint-teal-bd:#9fd3cd;
    --tint-violet-bd:#cdbdf0; --tint-pnc-bd:#eec0d3;
    --grad-blue:linear-gradient(180deg,#e9f2fd,#f5f9ff);
    --grad-violet:linear-gradient(180deg,#f3ecfc,#f8f5fe);
    --grad-amber:linear-gradient(180deg,#fbf3df,#fbf7ef);
    --team-portal:#2a78d6; --team-pnc:#c1367a;
    --chart-bar:#2a78d6;
    --ord-1:#6da7ec; --ord-2:#2a78d6; --ord-3:#16457e;
    --grid:#e4e9ef; --axis:#c8d0dc;
  }
  /* ---- INSTRUMENT WHITE ----
     A scientific-plotter look: warm-white paper, hairlines, drafting pens, and
     quantities drawn as discrete dots rather than filled bars. Adapted from the
     instrument-white/ design system.

     One deliberate deviation. That system has six pens, but three of them double
     as its state colours, and the warm three are mutually indistinguishable
     (ochre↔cinnabar measures ΔE 1.7 under deuteranopia). So there is no way to
     have two team colours AND three state colours all separable by hue. The fix
     is to split them by ROLE: cool+ochre pens carry team identity, warm pens are
     reserved for state, and the team tick also differs in SHAPE (Portal a filled
     dot, P&C a ring) so identity survives without relying on hue at all.
     Team pair validated on paper: CVD ΔE 27.2 protan, normal-vision 31.9. */
  :root[data-theme="instrument"]{
    color-scheme:light;
    --bg:#FFFFFF; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F7F7F4;
    --line:#E7E6DF; --line2:#D6D5CC;
    --txt:#12141A; --muted:#5A5E68; --faint:#9A9EA8;
    --accent:#1B4FA0; --accent2:#6B3FA0;
    --green:#0E7C63; --amber:#B07500; --red:#D93A1E; --teal:#0E7C63;
    --chip:#FFFFFF;
    --on-accent:#FFFFFF;
    --err-ink:#D93A1E;
    --tint-amber-bd:#E4D3A6; --tint-amber-bg:#FDF8EC;
    --tint-red-bd:#F0C0B6;   --tint-red-bg:#FDF1EE;
    --tint-green-bd:#B4D8CE; --tint-green-bg:#F0F7F5;
    --tint-blue-bd:#BFD0E6;  --tint-teal-bd:#B4D8CE;
    --tint-violet-bd:#D0C4E4; --tint-pnc-bd:#E4D3A6;
    /* the system forbids surface gradients — flat paper everywhere */
    --grad-blue:#FBFCFE; --grad-violet:#FCFBFE; --grad-amber:#FDFBF5;
    --radius:3px;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono","SF Mono",Consolas,monospace;
    --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --team-portal:#1B4FA0; --team-pnc:#B07500;
    --chart-bar:#1B4FA0;
    --ord-1:#8FB0D6; --ord-2:#1B4FA0; --ord-3:#0C2C5C;
    --grid:#E7E6DF; --axis:#D6D5CC;
    --rule-strong:#D6D5CC; --grid-dot:#DEDDD6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden}
  button{font-family:inherit;font-size:13px;color:var(--txt);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 11px;cursor:pointer;transition:.12s}
  button:hover{background:var(--line2);border-color:var(--faint)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 7px}
  button.ghost:hover{background:var(--panel2);color:var(--txt)}
  button.danger:hover{background:var(--tint-red-bg);border-color:var(--red);color:var(--red)}
  button.sm{padding:3px 8px;font-size:12px}
  button.go{background:var(--green);border-color:var(--green);color:var(--on-accent);font-weight:600}
  button.go:hover{filter:brightness(1.1)}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:54px;line-height:1.5}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin:0 0 4px 1px;font-weight:600}
  a{color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .hide{display:none!important}

  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
  header .logo{font-weight:700;letter-spacing:.5px;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  header .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .nav{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
  .navbtn{background:transparent;border:none;color:var(--muted);padding:5px 13px;border-radius:6px;font-weight:600}
  .navbtn:hover{background:var(--panel2);color:var(--txt)}
  .navbtn.active{background:var(--accent);color:var(--on-accent)}
  header .spacer{flex:1}
  /* shrinkable so a cramped header (extra buttons, narrow window) squeezes the
     search instead of forcing the whole page to scroll sideways — Ctrl+K still works */
  .hsearch{position:relative;flex:0 1 290px;min-width:0}
  .hsearch input{padding-left:30px;background:var(--panel)}
  .hsearch svg{position:absolute;left:9px;top:8px;width:15px;height:15px;opacity:.5}
  .filebar{display:flex;align-items:center;gap:7px}
  .savestate{font-size:11px;color:var(--faint);min-width:74px;text-align:right}
  .savestate.dirty{color:var(--amber)}
  .savestate.saved{color:var(--green)}

  main{display:flex;flex:1;min-height:0}
  aside{width:340px;flex:0 0 340px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side-tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters select{width:auto;flex:1;min-width:0;padding:5px 6px;font-size:12px}
  /* multi-select status filter — chips beat a <select multiple>, which needs
     ctrl-clicking and hides what's selected behind a scroll box */
  .statusfilter{display:flex;flex-wrap:wrap;gap:4px}
  .sfchip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;
    border:1px solid var(--line2);background:transparent;color:var(--faint);
    font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;transition:.12s}
  .sfchip:hover{border-color:var(--faint);color:var(--muted)}
  .sfchip b{font-size:10px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
  .sfchip.on{background:var(--chip)}
  .sfchip.on.new{color:var(--accent);border-color:var(--tint-blue-bd)}
  .sfchip.on.progress{color:var(--teal);border-color:var(--tint-teal-bd)}
  .sfchip.on.blocked{color:var(--red);border-color:var(--tint-red-bd)}
  .sfchip.on.review{color:var(--amber);border-color:var(--tint-amber-bd)}
  .sfchip.on.done{color:var(--green);border-color:var(--tint-green-bd)}
  .sfchip.clear{border-style:dashed}
  .stats{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px}
  .stat{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 2px}
  .stat b{display:block;font-size:16px;font-weight:700}
  .stat.ov b{color:var(--red)} .stat.op b{color:var(--accent)} .stat.dl b{color:var(--green)} .stat.bl b{color:var(--amber)}
  .listwrap{flex:1;overflow:auto;padding:8px}
  .empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px}

  /* ticket cards — team is the primary visual demarcation */
  .tcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .tcard:hover{border-color:var(--line2);background:var(--panel2)}
  .tcard.active{border-color:var(--accent);background:var(--panel2)}
  .tcard .tid{font-family:var(--mono);font-size:11px;font-weight:600}
  .tcard .ttitle{font-weight:600;margin:2px 0 5px;font-size:13.5px}
  .tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .tcard.tm-portal{border-left-color:var(--team-portal)} .tcard.tm-portal .tid{color:var(--team-portal)}
  .tcard.tm-pnc{border-left-color:var(--team-pnc)} .tcard.tm-pnc .tid{color:var(--team-pnc)}
  .tcard.st-done{opacity:.65}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--line2);background:var(--chip);white-space:nowrap}
  .pill.new{color:var(--accent);border-color:var(--tint-blue-bd)}
  .pill.progress{color:var(--teal);border-color:var(--tint-teal-bd)}
  .pill.blocked{color:var(--red);border-color:var(--tint-red-bd)}
  .pill.review{color:var(--amber);border-color:var(--tint-amber-bd)}
  .pill.done{color:var(--faint)}
  .pill.tag{color:var(--muted);text-transform:none;font-weight:500}
  .pill.prio-P1{color:var(--red);border-color:var(--tint-red-bd)} .pill.prio-P2{color:var(--amber);border-color:var(--tint-amber-bd)}
  .pill.prio-P3{color:var(--muted)} .pill.prio-P4{color:var(--faint)}
  .teampill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:5px;border:1px solid var(--line2);background:var(--chip);white-space:nowrap}
  .teampill.tm-portal{color:var(--team-portal);border-color:var(--tint-blue-bd)}
  .teampill.tm-pnc{color:var(--team-pnc);border-color:var(--tint-pnc-bd)}
  .bossflag{font-size:10px;font-weight:700;color:var(--on-accent);background:var(--accent2);border-radius:4px;padding:1px 6px}
  .due{font-family:var(--mono);font-size:11px}
  .due.over{color:var(--red);font-weight:700} .due.soon{color:var(--amber)}
  .warnchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px;border:1px solid var(--tint-amber-bd);background:var(--tint-amber-bg);color:var(--amber)}
  .warnchip.bad{border-color:var(--tint-red-bd);background:var(--tint-red-bg);color:var(--red)}
  .warnchip.info{border-color:var(--line2);background:var(--chip);color:var(--muted)}
  .warnchip.good{border-color:var(--tint-green-bd);background:var(--tint-green-bg);color:var(--green)}

  section.detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .detail-head{padding:16px 22px 0;border-bottom:1px solid var(--line)}
  .detail-head .dh-top{display:flex;align-items:flex-start;gap:14px}
  .detail-head h1{font-size:19px;margin:0;flex:1;font-weight:650}
  /* wraps because an incident can carry several status chips at once, and without
     it they overflow the title block and collide with the header buttons */
  .dh-id{font-family:var(--mono);font-size:13px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;row-gap:5px}
  .dh-dates{display:flex;gap:18px;margin:10px 0 0;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .tabs{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
  .tab{padding:8px 15px;border:none;background:transparent;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);font-weight:600;font-size:13px}
  .tab:hover{background:transparent;color:var(--txt)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .count{font-size:10px;background:var(--panel2);border-radius:10px;padding:0 6px;margin-left:5px;color:var(--muted)}
  .detail-body{flex:1;overflow:auto;padding:20px 22px}
  .nopick{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:14px;color:var(--faint);text-align:center;padding:30px}
  .nopick svg{width:54px;height:54px;opacity:.25}

  .sec-title{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .sec-title h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sec-title .ln{flex:1;height:1px;background:var(--line)}
  .field{margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:18px;background:var(--chip);border:1px solid var(--line2);font-size:12px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip .x{color:var(--faint);font-weight:700}
  .chip .x:hover{color:var(--red)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:600;padding:6px 9px;border-bottom:1px solid var(--line)}
  td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table input,table select,table textarea{background:transparent;border:1px solid transparent;padding:5px 6px}
  table input:hover,table select:hover,table textarea:hover{border-color:var(--line)}
  table input:focus,table select:focus,table textarea:focus{background:var(--bg2);border-color:var(--accent)}
  table textarea{min-height:32px}
  .tbl-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}

  /* status disagreement banner */
  .disagree{display:flex;align-items:center;gap:10px;border:1px solid var(--tint-amber-bd);background:var(--tint-amber-bg);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12.5px}
  .disagree.bad{border-color:var(--tint-red-bd);background:var(--tint-red-bg)}

  /* commitment ledger */
  .ledger{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--panel);margin-bottom:14px}
  .ledger .lh{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12px;color:var(--muted)}
  .promise{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
  .promise:last-child{border-bottom:none}
  .promise .pe{font-family:var(--mono);flex:0 0 100px}
  .promise .pg{color:var(--faint);font-size:11px;flex:0 0 130px}
  .promise .pn{flex:1;color:var(--muted)}
  .promise.latest .pe{font-weight:700;color:var(--txt)}
  .promise.missed .pe{color:var(--red)}
  .slipline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .slipline .arw{color:var(--faint)}

  /* hurdles */
  .hurdle{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:9px 12px;margin-bottom:8px}
  .hurdle.resolved{border-left-color:var(--green);opacity:.72}
  .hurdle .htop{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .hurdle .htop .hk{flex:0 0 150px} .hurdle .htop .ho{flex:0 0 150px}
  .hurdle .htxt{flex:1;cursor:text;font-size:13px;padding:2px 4px;border-radius:4px}
  .hurdle .htxt:hover{background:var(--bg2)}
  .hurdle .hres{font-size:12px;color:var(--teal);white-space:pre-wrap;cursor:text;padding:3px 0 0 4px}
  .hurdle .hmeta{font-size:11px;color:var(--faint);display:flex;gap:12px;margin-top:4px}
  .kindtag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 7px;border:1px solid var(--line2);background:var(--chip);color:var(--muted)}

  /* updates timeline */
  .upd{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
  .upd:last-child{border-bottom:none}
  .upd .uts{flex:0 0 128px;font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px}
  .upd .ubody{flex:1;min-width:0}
  .upd .utxt{white-space:pre-wrap;font-size:13.5px;cursor:text;padding:2px 4px;border-radius:4px;line-height:1.55}
  .upd .utxt:hover{background:var(--bg2)}
  .upd .usrc{font-size:11px;color:var(--faint);margin-top:3px}
  .upd .nact{opacity:0}.upd:hover .nact{opacity:1}
  .add-upd{display:flex;gap:8px;align-items:flex-end;margin-bottom:14px}
  .add-upd textarea{flex:1;min-height:44px}
  .add-upd button{flex:0 0 auto;align-self:stretch}

  /* action items */
  .actitem{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px;margin-bottom:6px;flex-wrap:wrap}
  .actitem .chk{cursor:pointer;width:16px;height:16px;flex:0 0 16px;border:1.5px solid var(--line2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px}

  /* risk register */

  /* dependencies */

  /* ===== SYNC MODE ===== */

  /* today dashboard */

  .ecard.active{border-color:var(--accent);background:var(--panel2)}

  .ebox.bad b{color:var(--red)} .ebox.warn b{color:var(--amber)} .ebox.good b{color:var(--green)}

  /* lookalikes */
  .lookwrap{border:1px solid var(--tint-violet-bd);background:var(--grad-violet);border-radius:9px;padding:11px 13px;margin-bottom:16px}
  .lookwrap .lk-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent2);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .lookrow{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 11px;margin-bottom:6px;cursor:pointer}
  .lookrow:hover{border-color:var(--accent2)}
  .lookrow .lr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lookrow .lr-id{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent)}
  .lookrow .lr-t{font-size:13px;font-weight:600;flex:1;min-width:120px}
  .lookrow .lr-why{font-size:10.5px;color:var(--faint);margin-top:4px}
  .lookrow .lr-body{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;white-space:pre-wrap}
  .lookrow .lr-body b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:8px 0 3px}
  .lookrow .lr-body b:first-child{margin-top:0}
  .patbadge{font-size:10px;font-weight:700;color:var(--on-accent);background:var(--accent2);border-radius:4px;padding:1px 6px}
  .seenbadge{font-size:10px;font-weight:700;color:var(--accent2);border:1px solid var(--tint-violet-bd);background:var(--chip);border-radius:4px;padding:1px 6px}

  /* knowledge */
  .segmented{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
  .segmented button{flex:1;background:transparent;border:none;color:var(--muted);font-weight:600;padding:5px 2px;border-radius:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .segmented button.on{background:var(--accent);color:var(--on-accent)}
  .pcard2{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
  .pcard2:hover{background:var(--panel2)}
  .pcard2.active{border-color:var(--accent);background:var(--panel2)}
  .pcard2 .p2t{font-weight:650;font-size:13.5px}
  .pcard2 .p2m{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .ccard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
  .ccard:hover{background:var(--panel2)}
  .ccard.active{border-color:var(--accent);background:var(--panel2)}
  .stackchip{font-size:10.5px;font-weight:700;color:var(--teal);border:1px solid var(--tint-teal-bd);background:var(--chip);border-radius:4px;padding:1px 7px}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:13px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;bottom:26px}
  .toast.err{border-color:var(--red);color:var(--err-ink)}

  /* right-anchored so it can never run past the viewport edge — left-anchoring at a
     fixed width overflowed once the nav grew and the window got narrow */
  .gsearch{position:absolute;top:40px;right:0;left:auto;width:430px;max-width:calc(100vw - 32px);
    background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px;max-height:60vh;overflow:auto;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .gsr{overflow-wrap:anywhere}
  .gsr{padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px}
  .gsr:hover{background:var(--panel2)}
  .gsr .k{font-size:10px;text-transform:uppercase;color:var(--faint);letter-spacing:.5px;margin-right:6px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg2)}
  ::-webkit-scrollbar-track{background:transparent}

  /* the nav grew to six workspaces — give the header room to breathe on smaller screens */
  @media (max-width:1180px){
    aside{width:300px;flex:0 0 300px}
    .queue{width:340px;flex:0 0 340px}
  }
  @media (max-width:980px){
    header{gap:9px;padding:9px 11px}
    header .logo span:not(.dot){display:none}
    #fileLabel{display:none}
    .navbtn{padding:5px 9px;font-size:12.5px}
  }

  /* delivery gates */
  .gatebox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:14px}
  .gatebox .gb-h{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-bottom:8px}
  .gatebox .gb-h b{color:var(--txt);font-size:12.5px}
  .gaterow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .gstep{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:16px;border:1.5px solid var(--line2);
    background:var(--chip);font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);transition:.12s}
  .gstep:hover{border-color:var(--accent)}
  .gstep.done{background:var(--tint-green-bg);border-color:var(--tint-green-bd);color:var(--green)}
  .gstep .gs-on{font-size:10px;font-weight:400;opacity:.75;font-family:var(--mono)}
  .gstep.next{border-color:var(--accent);color:var(--txt)}
  .gatearrow{color:var(--faint);font-size:11px}
  .evid-missing{border-color:var(--amber)!important}

  /* talking points */
  .tprow{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin-bottom:6px}
  .tprow.done .tp-t{text-decoration:line-through;color:var(--faint)}
  .tprow .tp-t{flex:1;font-size:13px;cursor:text;padding:2px 4px;border-radius:4px}
  .tprow .tp-t:hover{background:var(--bg2)}
  .tprow .nact{opacity:0}.tprow:hover .nact{opacity:1}
  .qrow.tp{border-left-color:var(--teal);cursor:default}
  .qrow.tp .qtitle{white-space:normal}
  .tpbadge{font-size:10px;font-weight:700;color:var(--teal);border:1px solid var(--tint-teal-bd);background:var(--chip);border-radius:4px;padding:1px 6px}
  /* epic grouping in the queue */
  .qepic{margin-bottom:8px}
  .qe-head{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;
    border:1px dashed var(--line2);background:var(--chip);margin-bottom:5px}
  .qe-head:hover{border-color:var(--accent);border-style:solid}
  .qe-name{font-size:11.5px;font-weight:700;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qe-n{font-size:10px;font-weight:700;color:var(--muted);background:var(--panel);border-radius:9px;padding:0 6px;flex:0 0 auto}
  .qe-go{margin-left:auto;font-size:9.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto}
  .qe-head:hover .qe-go{color:var(--accent)}
  .qe-items{margin-left:10px;padding-left:8px;border-left:1px dotted var(--line2)}

  /* epic group capture rows */
  .gerow{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:8px;padding:10px 12px;margin-bottom:10px}
  .gerow.covered{opacity:.6;border-left-color:var(--green)}
  .gerow .ge-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .gerow .ge-title{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gerow .ge-last{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:7px}
  .gerow .ge-said{min-height:52px;font-size:12.5px}
  .gerow .ge-fields{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
  .gerow .ge-fields select{flex:0 0 130px}
  .gerow .ge-fields input[type="date"]{flex:0 0 150px}
  .gerow .ge-fields input:not([type="date"]){flex:1;min-width:110px}
  .gerow .ge-fields button{flex:0 0 auto}

  .qrow.agenda{border-left-color:var(--accent2);cursor:default}
  .qrow.agenda .qtitle{white-space:normal}
  .agbadge{font-size:10px;font-weight:700;color:var(--accent2);border:1px solid var(--tint-violet-bd);background:var(--chip);border-radius:4px;padding:1px 6px}
  .mkind{font-size:10.5px;font-weight:700;color:var(--teal);border:1px solid var(--tint-teal-bd);background:var(--chip);border-radius:5px;padding:1px 8px;white-space:nowrap}
  .callcard{display:flex;align-items:center;gap:10px;padding:8px 7px;border-radius:6px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
  .callcard:last-child{border-bottom:none}.callcard:hover{background:var(--panel2)}
  .callcard .cc-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .callcard .cc-sub{font-size:11px;color:var(--faint);white-space:nowrap;flex:0 0 auto}

  /* decisions */
  .decrow{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;padding:9px 12px;margin-bottom:7px}
  .decrow .dc-date{flex:0 0 92px;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px}
  .decrow .dc-t{flex:1;font-size:13.5px;line-height:1.5;cursor:text;padding:2px 4px;border-radius:4px;white-space:pre-wrap}
  .decrow .dc-t:hover{background:var(--bg2)}
  .decrow .dc-by{flex:0 0 110px;font-size:11.5px;color:var(--faint);padding-top:2px}
  .decrow .nact{opacity:0}.decrow:hover .nact{opacity:1}
  .decform{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;margin-bottom:14px}

  /* insights */
  .kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .kpi b{display:block;font-size:30px;font-weight:700;line-height:1.1}
  .kpi span{font-size:11.5px;color:var(--muted)}
  .kpi.bad b{color:var(--red)} .kpi.warn b{color:var(--amber)}
  .chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px;align-items:start}
  .chcard{overflow:hidden}
  .chcard .chq{font-size:11.5px;color:var(--faint);margin:-4px 0 10px}
  .chcard svg{display:block;max-width:100%;overflow:visible}
  .chbar rect{transition:opacity .12s}
  .chbar:hover rect,.chbar:focus rect{opacity:.78}
  .chbar:focus{outline:2px solid var(--accent);outline-offset:2px}
  .chlegend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:9px;font-size:11.5px;color:var(--muted)}
  .chlegend span{display:inline-flex;align-items:center;gap:6px}
  .chlegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chtip{position:fixed;z-index:150;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;
    padding:6px 10px;font-size:12px;color:var(--txt);pointer-events:none;opacity:0;transition:opacity .12s;
    box-shadow:0 8px 26px rgba(0,0,0,.5);white-space:nowrap;max-width:90vw}
  .chtip.on{opacity:1}

  /* effort / capacity */
  /* day-first date pickers — see enhanceDateFields(). The native mm/dd/yyyy text is
     masked and a dd-mm-yyyy label painted over it; the input itself is untouched so
     its value stays ISO and the calendar picker still works. */
  .dwrap{position:relative;display:block}
  .dwrap>input[type="date"]::-webkit-datetime-edit{opacity:0}
  .dwrap>.dlabel{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;
    font-size:13px;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .dwrap>.dlabel.ph{color:var(--faint)}
  table .dwrap>.dlabel{left:7px;font-size:12.5px}

  .capbar{height:24px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:flex;margin:8px 0 4px}
  .capbar .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--on-accent);white-space:nowrap;overflow:hidden}
  .capbar .seg.appr{background:var(--green)} .capbar .seg.pend{background:var(--amber)}
  .capbar .seg.over{background:var(--red)}
  .caplegend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .caplegend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .appstat{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 8px;border:1px solid}
  .appstat.pending{color:var(--amber);border-color:var(--tint-amber-bd);background:var(--tint-amber-bg)}
  .appstat.approved{color:var(--green);border-color:var(--tint-green-bd);background:var(--tint-green-bg)}
  .appstat.rejected{color:var(--red);border-color:var(--tint-red-bd);background:var(--tint-red-bg)}
  .vendorpill{font-size:10px;font-weight:700;color:var(--accent2);border:1px solid var(--tint-violet-bd);background:var(--chip);border-radius:4px;padding:1px 7px}
  .fcflag{display:flex;align-items:center;gap:9px;border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:13px;border:1px solid}
  .fcflag.up{border-color:var(--tint-amber-bd);background:var(--tint-amber-bg)}
  .fcflag.down{border-color:var(--tint-blue-bd);background:var(--grad-blue)}
  .fcflag.hold{border-color:var(--tint-green-bd);background:var(--tint-green-bg)}
  .qnav{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
  .qnav b{font-size:14px;min-width:80px;text-align:center}

  /* brief document — light "paper", both in the modal preview and on print */
  .specpaper{background:#fff;color:#15202b;max-height:56vh;overflow:auto;border-radius:6px;padding:26px 30px}
  .briefdoc h1{font-size:22px;margin:0 0 4px;color:#0b3d6e}
  .briefdoc .meta{font-size:12px;color:#475569;margin-bottom:18px;border-bottom:1px solid #d0d7de;padding-bottom:10px}
  .briefdoc h3{font-size:12px;margin:22px 0 10px;color:#0b3d6e;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .briefdoc h4{font-size:15px;margin:0 0 6px;color:#15202b;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .briefdoc h4 .code{font-size:11px;color:#64748b;font-weight:400;font-family:var(--mono)}
  .briefdoc .bblock{border:1px solid #e2e8f0;border-radius:7px;padding:13px 15px;margin-bottom:11px;background:#f8fafc}
  .briefdoc blockquote{margin:8px 0;padding:9px 13px;background:#fff;border-left:3px solid #0b3d6e;border-radius:0 5px 5px 0;font-size:14px;line-height:1.6}
  .briefdoc blockquote .asat{font-size:11px;color:#64748b;margin-top:5px;font-style:italic}
  .briefdoc .nums{font-size:12.5px;color:#475569;margin:6px 0}
  .briefdoc .warn{font-size:12.5px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;padding:5px 9px;margin:6px 0}
  .briefdoc ul{margin:6px 0 0 18px;padding:0}
  .briefdoc li{margin:3px 0;font-size:13px;line-height:1.55}
  .briefdoc i{color:#64748b}
  .briefdoc .hpill{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 8px;border:1px solid}
  .briefdoc .hpill.h-green{color:#166534;background:#f0fdf4;border-color:#bbf7d0}
  .briefdoc .hpill.h-amber{color:#92400e;background:#fffbeb;border-color:#fde68a}
  .briefdoc .hpill.h-red{color:#991b1b;background:#fef2f2;border-color:#fecaca}
  .briefdoc .hpill.h-unknown{color:#475569;background:#f1f5f9;border-color:#cbd5e1}

  /* ============================================================
     INSTRUMENT WHITE — structure. The palette above only recolours; this is
     what makes it read as an instrument: near-square geometry, hairlines,
     registration tics, silkscreen micro-labels and mono tabular figures.
     Scoped entirely under the theme attribute, so dark/light are untouched.
     ============================================================ */
  :root[data-theme="instrument"] body{font-size:13px;letter-spacing:.005em}
  /* Engineering dot-grid — a blueprint plane the whole app sits on. Uniform and
     nearly imperceptible rather than masked to a corner; it should read as paper
     stock, not as a decorative flourish in one region. */
  :root[data-theme="instrument"] #app::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px,var(--grid-dot) 1px,transparent 0);
    background-size:22px 22px;opacity:.45}
  :root[data-theme="instrument"] header,
  :root[data-theme="instrument"] main{position:relative;z-index:1}
  /* The grid only shows if the big surfaces stop painting opaque white over it.
     Cards keep their solid --panel fill, so they read as sheets laid on the grid. */
  :root[data-theme="instrument"] header,
  :root[data-theme="instrument"] aside,
  :root[data-theme="instrument"] section.detail,
  :root[data-theme="instrument"] .capture,
  :root[data-theme="instrument"] .queue,
  :root[data-theme="instrument"] .detail-body,
  :root[data-theme="instrument"] .listwrap,
  :root[data-theme="instrument"] .dash{background:transparent}

  /* geometry: nearly square, hairlines, no shadows */
  :root[data-theme="instrument"] button,
  :root[data-theme="instrument"] input,
  :root[data-theme="instrument"] select,
  :root[data-theme="instrument"] textarea,
  :root[data-theme="instrument"] .pill,
  :root[data-theme="instrument"] .chip,
  :root[data-theme="instrument"] .warnchip,
  :root[data-theme="instrument"] .teampill{border-radius:2px}
  :root[data-theme="instrument"] .tcard,
  :root[data-theme="instrument"] .dashcard,
  :root[data-theme="instrument"] .chcard,
  :root[data-theme="instrument"] .kpi,
  :root[data-theme="instrument"] .modal,
  :root[data-theme="instrument"] .ledger,
  :root[data-theme="instrument"] .gatebox,
  :root[data-theme="instrument"] .ecard,
  :root[data-theme="instrument"] .rcard,
  :root[data-theme="instrument"] .pcard,
  :root[data-theme="instrument"] .pcard2,
  :root[data-theme="instrument"] .ccard,
  :root[data-theme="instrument"] .qrow,
  :root[data-theme="instrument"] .lookwrap,
  :root[data-theme="instrument"] .depbar,
  :root[data-theme="instrument"] .sugg,
  :root[data-theme="instrument"] .headline,
  :root[data-theme="instrument"] .nextcall{border-radius:3px;box-shadow:none}
  :root[data-theme="instrument"] .toast,
  :root[data-theme="instrument"] .gsearch,
  :root[data-theme="instrument"] .modal{box-shadow:0 2px 10px rgba(18,20,26,.07)}

  /* registration tics — the detail that reads as "instrument", not "web card".
     Panels only; list rows would be noise at that density. */
  :root[data-theme="instrument"] .dashcard,
  :root[data-theme="instrument"] .chcard,
  :root[data-theme="instrument"] .kpi,
  :root[data-theme="instrument"] .ledger,
  :root[data-theme="instrument"] .gatebox,
  :root[data-theme="instrument"] .pairpanel,
  :root[data-theme="instrument"] .modal{position:relative}
  :root[data-theme="instrument"] .dashcard::before,
  :root[data-theme="instrument"] .dashcard::after,
  :root[data-theme="instrument"] .chcard::before,
  :root[data-theme="instrument"] .chcard::after,
  :root[data-theme="instrument"] .kpi::before,
  :root[data-theme="instrument"] .kpi::after,
  :root[data-theme="instrument"] .ledger::before,
  :root[data-theme="instrument"] .ledger::after,
  :root[data-theme="instrument"] .gatebox::before,
  :root[data-theme="instrument"] .gatebox::after,
  :root[data-theme="instrument"] .modal::before,
  :root[data-theme="instrument"] .modal::after{
    content:"";position:absolute;width:7px;height:7px;border:solid var(--rule-strong);pointer-events:none}
  :root[data-theme="instrument"] .dashcard::before,
  :root[data-theme="instrument"] .chcard::before,
  :root[data-theme="instrument"] .kpi::before,
  :root[data-theme="instrument"] .ledger::before,
  :root[data-theme="instrument"] .gatebox::before,
  :root[data-theme="instrument"] .modal::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
  :root[data-theme="instrument"] .dashcard::after,
  :root[data-theme="instrument"] .chcard::after,
  :root[data-theme="instrument"] .kpi::after,
  :root[data-theme="instrument"] .ledger::after,
  :root[data-theme="instrument"] .gatebox::after,
  :root[data-theme="instrument"] .modal::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}

  /* silkscreen micro-labels */
  :root[data-theme="instrument"] label,
  :root[data-theme="instrument"] .kpi span,
  :root[data-theme="instrument"] .stat,
  :root[data-theme="instrument"] .ebox span,
  :root[data-theme="instrument"] .qsec{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase}
  :root[data-theme="instrument"] .dashcard h3,
  :root[data-theme="instrument"] .sec-title h3,
  :root[data-theme="instrument"] .chcard h3,
  :root[data-theme="instrument"] .queue-head h3{font-size:9px;letter-spacing:.22em;font-weight:600;color:var(--ink-2,var(--muted))}
  :root[data-theme="instrument"] .navbtn{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;

  /* every figure mono + tabular — non-tabular digits make values jitter */

  /* pills: outlined silkscreen, not filled lozenges */
  :root[data-theme="instrument"] .pill,
  :root[data-theme="instrument"] .teampill,

  /* team identity carries a SHAPE as well as a hue: Portal a filled tick,

    content:"";width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;flex:0 0 6px}

  /* ---- type roles ----

  /* tracked uppercase is wider than the sans it replaced — let these size to their

  /* empty / nothing-picked states read as instrument copy too */

  /* controls: quiet outlined silkscreen, not filled lozenges. Even the primary

  :root[data-theme="instrument"] .side-tools button{padding:6px 9px}

  /* inputs sit on hairlines rather than filled wells */
  :root[data-theme="instrument"] input,

  /* denser, instrument-panel spacing */
  :root[data-theme="instrument"] .dashcard{padding:11px 13px 13px}

  :root[data-theme="instrument"] .dashitem{font-size:11.5px;padding:6px 2px}
  :root[data-theme="instrument"] .dashitem .di-sub{font-size:9.5px;letter-spacing:.04em}
  :root[data-theme="instrument"] .banner,

  /* list rows: hairline separation instead of filled cards */
  :root[data-theme="instrument"] .tcard{border-left-width:2px;background:transparent}
  :root[data-theme="instrument"] .tcard:hover,
  :root[data-theme="instrument"] .tcard.active{background:var(--panel2)}
  :root[data-theme="instrument"] .tcard .tid,
  :root[data-theme="instrument"] .qrow .qid{font-family:var(--mono);letter-spacing:.02em}
  :root[data-theme="instrument"] .dashitem{border-bottom:1px dotted var(--rule-strong)}

  /* the capacity bar is the one filled bar left — becomes a dot bank */
  :root[data-theme="instrument"] .capbar{border:none;background:transparent;height:auto;display:block}

  #printArea{display:none}

<script>
"use strict";
/* ---- theme: applied BEFORE anything renders, and kept in plain localStorage
   (NOT the encrypted data file) so it works on the lock screen and never sits
   behind the master password. Purely presentational — no logic reads it. ---- */
const THEME_KEY="teamdesk.theme";
const THEMES=["dark","light","instrument"];
const THEME_ICON={dark:"☀",light:"▦",instrument:"🌙"};   /* icon shows what you'd switch TO */
const THEME_NEXT_LABEL={dark:"light",light:"instrument",instrument:"dark"};
function currentTheme(){try{const t=localStorage.getItem(THEME_KEY);return THEMES.includes(t)?t:"dark";}catch(e){return "dark";}}
function applyTheme(t){const el=document.documentElement;el.setAttribute("data-theme",t);
  /* Chromium doesn't reliably invalidate the paint of already-rendered persistent
     chrome (the header) when a :root custom property changes. Detaching and
     reattaching the root forces every element to re-resolve the variables. It's
     synchronous, so the browser never paints the intermediate state — no flash. */
  el.style.display="none";void el.offsetHeight;el.style.display="";
  const b=document.getElementById("btnTheme");
  if(b){b.textContent=THEME_ICON[t]||"☀";b.title="Switch to "+THEME_NEXT_LABEL[t]+" theme";}}
function toggleTheme(){
  const nx=THEMES[(THEMES.indexOf(currentTheme())+1)%THEMES.length];
  try{localStorage.setItem(THEME_KEY,nx);}catch(e){}
  applyTheme(nx);
  /* charts render differently per theme, so a full re-render is required here —
     unlike dark↔light, this is not a pure CSS swap */
  if(typeof renderApp==="function")renderApp();}
applyTheme(currentTheme());
/* ============================================================
   TEAM DESK v1 — two-team ticket, people & knowledge tracker.
   Phase 1: data model + persistence, Tickets workspace, Sync mode.
   Local .json file (File System Access API) + IndexedDB/localStorage mirror.
   Single file, no CDNs, works offline from a double-click.
   ============================================================ */

const LS_KEY="teamdesk.backup.v1", LS_HANDLE_HINT="teamdesk.hadfile", SNAP_KEY="teamdesk.snapshots.v1";
const uid=()=>crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(16).slice(2);
/* LOCAL date string. Deliberately NOT toISOString() — that converts to UTC, so in
   IST (+5:30) every date before 05:30 would come out as yesterday, and any date
   built by adding days would render one day short. */
function dstr(d){const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
const todayStr=()=>dstr(new Date());
const addDays=(n,from)=>dstr(new Date((from?new Date(from+"T00:00:00"):new Date()).getTime()+n*86400000));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
/* ---------- quarters & months (for vendor effort/capacity) ---------- */
function quarterOf(d){const s=String(d||todayStr());const y=s.slice(0,4),mo=parseInt(s.slice(5,7),10)||1;return y+"-Q"+(Math.floor((mo-1)/3)+1);}
function curQuarter(){return quarterOf(todayStr());}
function curMonth(){return todayStr().slice(0,7);}
function quarterMonths(q){const [y,qn]=q.split("-Q");const st=(parseInt(qn,10)-1)*3+1;return [0,1,2].map(i=>y+"-"+String(st+i).padStart(2,"0"));}
function shiftQuarter(q,d){let [y,qn]=q.split("-Q");y=parseInt(y,10);qn=parseInt(qn,10)+d;while(qn>4){qn-=4;y++;}while(qn<1){qn+=4;y--;}return y+"-Q"+qn;}
function quarterLabel(q){const [y,qn]=q.split("-Q");return "Q"+qn+" "+y;}
function monthLabel(m){const [y,mo]=String(m).split("-");return (MONTH_ABBR[parseInt(mo,10)-1]||"?")+" "+y;}
/* ---------- date DISPLAY (day-first) ----------
   Dates are STORED as ISO YYYY-MM-DD everywhere — that's what makes `a.date < b.date`
   sorting and the since/until comparisons work, so storage never changes. These two
   are display-only, used at render time. */
function fmtDate(iso){const s=String(iso==null?"":iso);
  if(!/^\d{4}-\d{2}-\d{2}/.test(s))return esc(s);
  return s.slice(8,10)+"-"+s.slice(5,7)+"-"+s.slice(0,4);}
function fmtMonth(iso){const s=String(iso==null?"":iso);
  if(!/^\d{4}-\d{2}/.test(s))return esc(s);
  return (MONTH_ABBR[parseInt(s.slice(5,7),10)-1]||"?")+" "+s.slice(0,4);}

/* my view of the ticket — deliberately short. Their status is free text (JIRA/SNOW vary). */
const MY_STATUS={
  new:{label:"New",cls:"new"},
  progress:{label:"In progress",cls:"progress"},
  blocked:{label:"Blocked",cls:"blocked"},
  review:{label:"In review / test",cls:"review"},
  done:{label:"Done",cls:"done"}
};
const OPEN_STATUSES=["new","progress","blocked","review"];
const HURDLE_KINDS={
  dependency:{label:"Dependency"}, access:{label:"Access / auth"}, knowledge:{label:"Knowledge gap"},
  vendor:{label:"Vendor / SAP"}, decision:{label:"Awaiting decision"}, environment:{label:"Environment"}, other:{label:"Other"}
};
const PRIORITIES=["P1","P2","P3","P4"];
/* Observations are dated, sourced records about a person. `confidence` keeps
   "I watched this happen" apart from "Thomas told me" — otherwise hearsay
   hardens into fact over six months. */
const OBS_KINDS={
  praise:{label:"Commendation",icon:"★",color:"var(--green)"},
  concern:{label:"Concern",icon:"▲",color:"var(--amber)"},
  growth:{label:"Growth",icon:"↗",color:"var(--teal)"},
  note:{label:"Note",icon:"•",color:"var(--muted)"}
};
const EPIC_HEALTH={
  green:{label:"On track",cls:"delivered",color:"var(--green)"},
  amber:{label:"At risk",cls:"review",color:"var(--amber)"},
  red:{label:"Off track",cls:"blocked",color:"var(--red)"},
  unknown:{label:"Not set",cls:"done",color:"var(--faint)"}
};
const HEALTH_ORDER=["unknown","green","amber","red"];
const RATING_STALE_DAYS=180;   /* a rating older than this is probably fiction */
const HEADLINE_STALE_DAYS=14;  /* the LUCA line your boss hears must stay current */
/* Meetings = the calls that AREN'T status syncs: governance/effort talks, epic
   reviews, 1:1s. Same notes/points/actions/decisions surface as a sync, minus the
   ticket queue, plus a scope (team / epic / people / tickets). */
const MEETING_KINDS={
  governance:{label:"Governance / effort",icon:"💼"},
  epic:{label:"Epic review",icon:"◆"},
  oneonone:{label:"1:1",icon:"🧑"},
  general:{label:"General",icon:"💬"}
};
/* He approves the outsourced team's changes only when they go to Production (by
   email), plus the odd weekend patch or non-demand ask. One log, kind-tagged. */
const APPROVAL_KINDS={
  prod:{label:"Move to Production",icon:"⬆"},
  weekend:{label:"Weekend patch",icon:"🛠"},
  other:{label:"Other",icon:"•"}
};
const MONTH_ABBR=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Risks are the things that outlive any one ticket — "the AD team always takes a
   week", "cutting Q4 hours before LUCA lands". Hurdles belong to a ticket; these
   don't, and without a home they die in a meeting note. */
/* ---- performance log ----
   Conduct, not state. One real episode usually contains SEVERAL distinct failures
   — a late ETA, then a false "done", then a wrong root cause — and it's the mix
   that reveals how a team actually fails. So an incident carries many kinds. */
const FAIL_KINDS={
  "late-response":{label:"Slow to respond",group:"Communication"},
  "no-eta":{label:"No ETA when asked",group:"Communication"},
  "missed-eta":{label:"Missed a committed ETA",group:"Commitment"},
  "escalation-only":{label:"Moved only after escalation",group:"Commitment"},
  "false-done":{label:"Declared done, wasn't",group:"Quality"},
  "untested":{label:"Delivered untested",group:"Quality"},
  "regression":{label:"Broke working functionality",group:"Quality"},
  "weak-analysis":{label:"Failed basic analysis",group:"Analysis"},
  "misdiagnosis":{label:"Wrong root cause",group:"Analysis"},
  "deflection":{label:"Blamed another team wrongly",group:"Analysis"},
  "no-reuse":{label:"Didn't reuse earlier work",group:"Analysis"},
  "effort-inflation":{label:"Implausible effort claim",group:"Effort"},
  "process-breach":{label:"Bypassed an agreed process",group:"Process"},
  "customer-visible":{label:"Reached the end user",group:"Impact"}
};
const INC_SEV={high:{label:"High",cls:"blocked"},medium:{label:"Medium",cls:"review"},low:{label:"Low",cls:"progress"}};
const INC_STATUS={open:{label:"Logged"},raised:{label:"Raised with vendor"},
  acknowledged:{label:"Acknowledged"},disputed:{label:"Disputed"},closed:{label:"Closed"}};
/* Evidence kinds. "derived" is auto-cited from the app's own records; everything
   else is something only he can supply. */
const EV_KINDS={
  derived:{label:"From the record",icon:"◆"},
  quote:{label:"What they said",icon:"❝"},
  email:{label:"Email / message",icon:"✉"},
  thirdparty:{label:"Third-party finding",icon:"⚖"},
  observed:{label:"What I saw",icon:"👁"},
  file:{label:"File / screenshot",icon:"🖼"}
};
const RISK_SEV={high:{label:"High",cls:"blocked"},medium:{label:"Medium",cls:"review"},low:{label:"Low",cls:"progress"}};
const RISK_STATUS={open:{label:"Open"},mitigating:{label:"Mitigating"},accepted:{label:"Accepted"},closed:{label:"Closed"}};
const RISK_REVIEW_DAYS=30;   /* default gap before a risk asks to be looked at again */
/* Words that carry no signal in a ticket corpus. "error", "issue", "user" and friends
   are in here because they appear in half the tickets and would match everything. */
const STOPWORDS=new Set(("the a an and or but if then for to of in on at by with from is are was were be been being "+
  "this that these those it its as not no we he she they i you our your their has have had do does did can could "+
  "will would should when what which who why how all any some new old get got need needs please thanks hi hello "+
  "issue issues problem problems error errors bug bugs ticket tickets request requests user users system systems "+
  "team teams work working works fix fixed fixing after before during still also only just now").split(" "));
const DEF_SOURCES=["JIRA","ServiceNow"];
const DEF_TEAMS=[
  {id:"portal",name:"Portal Team",mode:"managed",note:"I take status updates twice a week"},

/* ---------- crypto (Web Crypto, no deps) ---------- */
function isEncrypted(){return !!(state.settings.encryption&&masterPassword);}
function b64(buf){let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function ub64(str){const s=atob(str);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function encryptString(str,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(str));
  return JSON.stringify({_encrypted:true,app:"team-desk",v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)});}
function encryptStateStr(pw){return encryptString(JSON.stringify(state),pw);}
async function decryptEnvelope(env,pw){const key=await deriveKey(pw,ub64(env.salt));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(env.iv)},key,ub64(env.data));return JSON.parse(new TextDecoder().decode(pt));}
async function serializeData(){return isEncrypted()?await encryptStateStr(masterPassword):JSON.stringify(state,null,2);}
/* re-key stored snapshots when the master password is set/changed/removed, so no
   plaintext copy of the roster lingers in IndexedDB after encryption is turned on */
async function recryptSnapshots(oldPw,newPw){try{
  const arr=await getSnapshots();let changed=false;
  for(const s of arr){try{
    let plain=s.data;
    if(s.enc){ if(!oldPw)continue; plain=JSON.stringify(await decryptEnvelope(JSON.parse(s.data),oldPw)); }
    if(newPw){s.data=await encryptString(plain,newPw);s.enc=true;}else{s.data=plain;s.enc=false;}
    changed=true;
  }catch(e){}}
  if(changed)setSnapshots(arr);
}catch(e){}}

/* ---------- persistence ---------- */
let hadContent=false;
function contentCount(){return state.tickets.length+state.people.length+state.syncs.length+state.contacts.length+state.epics.length+state.patterns.length+state.decisions.length+state.agenda.length+state.meetings.length+state.efforts.length+state.approvals.length+state.risks.length+state.incidents.length;}
function isValidState(s){return s&&typeof s==="object"&&Array.isArray(s.tickets)&&Array.isArray(s.people)&&Array.isArray(s.contacts)&&Array.isArray(s.syncs)&&Array.isArray(s.epics)&&Array.isArray(s.patterns)&&Array.isArray(s.decisions)&&Array.isArray(s.agenda)&&Array.isArray(s.meetings)&&Array.isArray(s.capacity)&&Array.isArray(s.efforts)&&Array.isArray(s.forecasts)&&Array.isArray(s.approvals)&&Array.isArray(s.risks)&&Array.isArray(s.incidents);}
function noteContent(){if(isValidState(state)&&contentCount()>0)hadContent=true;}
function safeToPersist(){return isValidState(state)&&!(hadContent&&contentCount()===0);}
function markDirty(){noteContent();dirty=true;renderSaveState();backupLocal();scheduleAutoSave();}
function touch(o){o.updatedAt=Date.now();markDirty();}
function renderSaveState(){const el=document.getElementById("saveState");if(!el)return;
  const lock=state.settings.encryption?" 🔒":"";
  if(dirty){el.textContent=(fileHandle?"● Unsaved":"● Not saved")+lock;el.className="savestate dirty";}
  else{el.textContent=(fileHandle?(lastSaveAuto?"✓ Auto-saved":"✓ Saved"):"")+lock;el.className="savestate saved";}}
function scheduleAutoSave(){clearTimeout(autoSaveTimer);if(!state.settings.autosave||!supportsFS)return;autoSaveTimer=setTimeout(autoSaveNow,30000);}
async function autoSaveNow(){
  if(!state.settings.autosave||!fileHandle||!dirty)return;
  if(!isValidState(state)||(hadContent&&contentCount()===0))return; /* silent guard — never auto-write a suspicious state */
  try{const w=await fileHandle.createWritable();await w.write(await serializeData());await w.close();
    dirty=false;lastSaveAuto=true;renderSaveState();maybeSnapshot();}
  catch(e){/* permission revoked etc — stay dirty; manual Save surfaces the error */}
}

/* ---------- IndexedDB layer (optional; falls back to localStorage) ---------- */
const IDB_NAME="teamdesk", IDB_STORE="kv";
let idb=null, useIdb=false, savedHandle=null;
function idbOpen(){return new Promise((res,rej)=>{let rq;try{rq=indexedDB.open(IDB_NAME,1);}catch(e){return rej(e);}
  rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);};
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);rq.onblocked=()=>rej(new Error("idb blocked"));});}
function idbGet(k){return new Promise((res,rej)=>{try{const tx=idb.transaction(IDB_STORE,"readonly");const r=tx.objectStore(IDB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
function idbSet(k,v){return new Promise((res,rej)=>{try{const tx=idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}catch(e){rej(e);}});}
function idbDel(k){return new Promise((res)=>{try{const tx=idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});}
async function initStore(){
  try{idb=await idbOpen();useIdb=!!idb;}catch(e){idb=null;useIdb=false;}
  if(useIdb){try{
    if((await idbGet("backup"))==null){const ls=localStorage.getItem(LS_KEY);if(ls){await idbSet("backup",ls);const sn=localStorage.getItem(SNAP_KEY);if(sn)await idbSet("snapshots",sn);await idbSet("hadfile","1");}}
  }catch(e){}}
}
let encBackupTimer=null;
function persistBackup(str){
  try{localStorage.setItem(LS_KEY,str);localStorage.setItem(LS_HANDLE_HINT,"1");}catch(e){/* quota — IDB still covers it */}
  if(useIdb){idbSet("backup",str).catch(()=>{});idbSet("hadfile","1").catch(()=>{});}
}
function backupLocal(){
  if(!safeToPersist())return; /* never let a corrupt/emptied state clobber the good backup */
  if(isEncrypted()){clearTimeout(encBackupTimer);encBackupTimer=setTimeout(async()=>{if(!safeToPersist())return;try{persistBackup(await encryptStateStr(masterPassword));}catch(e){}},1000);return;}
  persistBackup(JSON.stringify(state));
}
async function loadBackup(){
  let raw=null;
  if(useIdb){try{const v=await idbGet("backup");if(v!=null)raw=v;}catch(e){}}
  if(raw==null){try{raw=localStorage.getItem(LS_KEY);}catch(e){}}
  if(raw==null)return false;
  try{const p=JSON.parse(raw);if(p&&p._encrypted){pendingEncrypted=p;return "encrypted";}state=migrate(p);return true;}catch(e){return false;}
}
async function getSnapshots(){
  if(useIdb){try{const v=await idbGet("snapshots");if(v!=null)return JSON.parse(v);}catch(e){}}
  try{return JSON.parse(localStorage.getItem(SNAP_KEY)||"[]");}catch(e){return [];}
}
function setSnapshots(arr){const str=JSON.stringify(arr);try{localStorage.setItem(SNAP_KEY,str);}catch(e){}if(useIdb)idbSet("snapshots",str).catch(()=>{});}
async function maybeSnapshot(){try{
  const arr=await getSnapshots();const today=todayStr();
  if(arr.length&&arr[arr.length-1].date===today)return;
  arr.push({date:today,ts:Date.now(),enc:isEncrypted(),data:await serializeData()});
  while(arr.length>14)arr.shift();
  setSnapshots(arr);
}catch(e){}}

/* ---------- persistent file handle ---------- */
function rememberHandle(){if(useIdb&&fileHandle){savedHandle=fileHandle;idbSet("handle",fileHandle).catch(()=>{});}updateReconnectUI();}
async function restoreHandle(){
  if(!useIdb||!supportsFS||fileHandle)return;
  try{savedHandle=await idbGet("handle");}catch(e){savedHandle=null;}
  if(!savedHandle)return;
  let perm="prompt";try{if(savedHandle.queryPermission)perm=await savedHandle.queryPermission({mode:"readwrite"});}catch(e){}
  if(perm==="granted"){fileHandle=savedHandle;setFileLabel(savedHandle.name);}
  updateReconnectUI();renderSaveState();
}
async function reconnectFile(){
  if(!savedHandle)return;
  try{
    let perm="prompt";if(savedHandle.queryPermission)perm=await savedHandle.queryPermission({mode:"readwrite"});
    if(perm!=="granted"&&savedHandle.requestPermission)perm=await savedHandle.requestPermission({mode:"readwrite"});
    if(perm==="granted"){fileHandle=savedHandle;setFileLabel(savedHandle.name);updateReconnectUI();renderSaveState();if(dirty)scheduleAutoSave();toast("Reconnected → "+savedHandle.name);}
    else toast("Permission not granted — use 📂 Open instead",true);
  }catch(e){toast("Couldn't reconnect: "+e.message,true);}
}
function updateReconnectUI(){const b=document.getElementById("btnReconnect");if(!b)return;
  if(savedHandle&&!fileHandle){b.classList.remove("hide");b.textContent="🔌 Reconnect "+(savedHandle.name||"file");}
  else b.classList.add("hide");}
async function forgetHandle(){savedHandle=null;if(useIdb)await idbDel("handle");updateReconnectUI();}

/* ---------- normalisers / migrate ---------- */
function normGateStep(s){return {id:s.id||uid(),text:s.text||"",done:!!s.done,doneOn:s.doneOn||""};}
function normGates(g){if(!g||!Array.isArray(g.steps)||!g.steps.length)return null;
  return {templateId:g.templateId||"",name:g.name||"",steps:g.steps.map(normGateStep)};}
function normTP(p){return {id:p.id||uid(),text:p.text||"",done:!!p.done,doneOn:p.doneOn||"",createdAt:p.createdAt||Date.now()};}
/* A decision is tiny on purpose: what was decided, by whom, when, where it applies.
   The value is entirely in still having it a year later. */
function normDecision(x){return {id:x.id||uid(),date:x.date||todayStr(),text:x.text||"",by:x.by||"",
  ticketId:x.ticketId||"",epicId:x.epicId||"",syncId:x.syncId||"",meetingId:x.meetingId||"",createdAt:x.createdAt||Date.now()};}
const clampRating=n=>Math.max(0,Math.min(10,Math.round(Number(n)||0)));
function normRating(r){return {id:r.id||uid(),rating:clampRating(r.rating),on:r.on||todayStr(),note:r.note||""};}
/* A skill keeps its whole rating history, so "Deepa BTP 4 → 7" is visible as a
   trajectory rather than just a number that quietly changed. */
function normSkill(s){
  let hist=(s.history||[]).map(normRating);
  if(!hist.length&&typeof s.rating==="number")hist=[normRating({rating:s.rating,on:s.ratedOn||todayStr()})]; /* pre-2a shape */
  hist.sort((a,b)=>a.on<b.on?-1:1);
  return {id:s.id||uid(),skill:s.skill||"",confidence:s.confidence==="observed"?"observed":"reported",
    note:s.note||"",history:hist};
}
function normObs(o){return {id:o.id||uid(),date:o.date||todayStr(),
  kind:OBS_KINDS[o.kind]?o.kind:"note",text:o.text||"",source:o.source||"",
  confidence:o.confidence==="observed"?"observed":"reported",
  ticketId:o.ticketId||"",
  /* stays out of every export unless he deliberately ticks it — a performance
     concern must never ride along into a brief for his boss by accident */
  includeInBrief:!!o.includeInBrief,
  createdAt:o.createdAt||Date.now()};}
function normPerson(p){return {id:p.id||uid(),name:p.name||"",team:p.team||"portal",role:p.role||"",
  skills:(p.skills||[]).map(normSkill),
  observations:(p.observations||[]).map(normObs),

  active:p.active!==false,note:p.note||"",createdAt:p.createdAt||Date.now(),updatedAt:p.updatedAt||Date.now()};}
/* A Pattern is a resolution that has hardened — the same problem seen more than once,
   written up once properly. `ticketIds` are the sightings, so "seen 3 times" is derived
   and can never drift out of step with the links. */
function normPattern(p){return {id:p.id||uid(),title:p.title||"",
  symptom:p.symptom||"",cause:p.cause||"",steps:p.steps||"",notes:p.notes||"",
  tags:[...new Set(p.tags||[])],
  ticketIds:[...new Set(p.ticketIds||[])],
  contactIds:[...new Set(p.contactIds||[])],
  createdAt:p.createdAt||Date.now(),updatedAt:p.updatedAt||Date.now()};}
function normEpic(e){return {id:e.id||uid(),name:e.name||"",code:e.code||"",description:e.description||"",
  owner:e.owner||"",teams:[...new Set(e.teams||[])],targetDate:e.targetDate||"",
  health:EPIC_HEALTH[e.health]?e.health:"unknown",

  notes:e.notes||"",closed:!!e.closed,
  createdAt:e.createdAt||Date.now(),updatedAt:e.updatedAt||Date.now()};}
function normContact(c){return {id:c.id||uid(),name:c.name||"",stack:c.stack||"",org:c.org||"",contact:c.contact||"",
  note:c.note||"",createdAt:c.createdAt||Date.now(),updatedAt:c.updatedAt||Date.now()};}
function normHurdle(h){return {id:h.id||uid(),text:h.text||"",kind:HURDLE_KINDS[h.kind]?h.kind:"other",
  raisedOn:h.raisedOn||todayStr(),owner:h.owner||"",resolvedOn:h.resolvedOn||"",resolution:h.resolution||""};}
function normPromise(p){return {id:p.id||uid(),eta:p.eta||"",givenOn:p.givenOn||todayStr(),note:p.note||""};}
function normUpdate(u){return {id:u.id||uid(),ts:u.ts||Date.now(),text:u.text||"",syncId:u.syncId||"",by:u.by||""};}
function normAction(a){return {id:a.id||uid(),text:a.text||"",owner:a.owner||"",due:a.due||"",done:!!a.done,
  resolution:a.resolution||"",fromSyncId:a.fromSyncId||"",

     an older file has no flag and its actions should still carry — but a minor

function normPoint(p){return {id:p.id||uid(),text:p.text||"",by:p.by||""};}
/* Subtasks: a flat checklist inside ONE ticket. Lets one "decommission system X"
   ticket hold its phases (analyse → migrate → decommission) instead of forcing a
   separate ticket per phase. Deliberately flat — the real cases are 2–4 steps. */
function normSubtask(x){return {id:x.id||uid(),title:x.title||"",done:!!x.done,doneOn:x.doneOn||"",note:x.note||"",owner:x.owner||""};}
/* Agenda: a point to raise in an UPCOMING sync for a team — added any time (e.g.
   the morning before an afternoon call), optionally tied to a ticket. */
function normAgenda(a){return {id:a.id||uid(),team:a.team||"portal",text:a.text||"",ticketId:a.ticketId||"",
  done:!!a.done,doneOn:a.doneOn||"",createdAt:a.createdAt||Date.now()};}
function normTicket(t){
  const st=MY_STATUS[t.myStatus]?t.myStatus:"new";
  return {id:t.id||uid(),ticketId:t.ticketId||"",source:t.source||"JIRA",team:t.team||"portal",
    title:t.title||"",description:t.description||"",
    /* dedupe on the way in — a hand-edited or merged file shouldn't double-count
       a tag in the skill evidence, or list the same person twice */
    tags:[...new Set(t.tags||[])],priority:PRIORITIES.includes(t.priority)?t.priority:"P3",
    myStatus:st,theirStatus:t.theirStatus||"",
    assignees:[...new Set(t.assignees||[])],
    epicId:t.epicId||"",
    /* Dependencies are stored ONE way only — "what am I waiting on". The inverse
       ("what am I holding up") is derived, so the two can never drift apart. */
    blockedBy:[...new Set(t.blockedBy||[])],
    subtasks:(t.subtasks||[]).map(normSubtask),
    gates:normGates(t.gates),evidence:t.evidence||"",statusChangedOn:t.statusChangedOn||"",
    raisedDate:t.raisedDate||"",startedDate:t.startedDate||"",dueDate:t.dueDate||"",closedDate:t.closedDate||"",
    promises:(t.promises||[]).map(normPromise),
    estHours:t.estHours||"",actHours:t.actHours||"",
    objects:(t.objects||[]).map(o=>({id:o.id||uid(),name:o.name||"",note:o.note||""})),
    hurdles:(t.hurdles||[]).map(normHurdle),
    contactIds:[...new Set(t.contactIds||[])],
    updates:(t.updates||[]).map(normUpdate),
    resolution:t.resolution?{symptom:t.resolution.symptom||"",cause:t.resolution.cause||"",
      steps:t.resolution.steps||"",timeTaken:t.resolution.timeTaken||"",notes:t.resolution.notes||""}:null,
    bossRelevant:!!t.bossRelevant,bossNote:t.bossNote||"",
    createdAt:t.createdAt||Date.now(),updatedAt:t.updatedAt||Date.now()};
}

function normEvidence(e){return {id:e.id||uid(),kind:EV_KINDS[e.kind]?e.kind:"observed",

function normIncStep(s){return {id:s.id||uid(),date:s.date||"",who:s.who||"",what:s.what||""};}
function normIncident(x){return {id:x.id||uid(),date:x.date||todayStr(),title:x.title||"",

  status:RISK_STATUS[r.status]?r.status:"open",

  team:m.team||"",epicId:m.epicId||"",personIds:[...new Set(m.personIds||[])],ticketIds:[...new Set(m.ticketIds||[])],

  actions:(s.actions||[]).map(normAction),

function migrate(d){
  d.version=1;
  d.settings=d.settings||{};
  const S=d.settings;
  S.teams=(S.teams&&S.teams.length)?S.teams.map(t=>({id:t.id,name:t.name||t.id,mode:t.mode==="observed"?"observed":"managed",note:t.note||"",outsourced:!!t.outsourced,vendorName:t.vendorName||""})):JSON.parse(JSON.stringify(DEF_TEAMS));
  S.tags=(S.tags&&S.tags.length)?S.tags.slice():[...DEF_TAGS];
  S.sources=(S.sources&&S.sources.length)?S.sources.slice():[...DEF_SOURCES];
  S.encryption=!!S.encryption;
  S.autosave=S.autosave!==false;
  S.staleDays=typeof S.staleDays==="number"?S.staleDays:7;
  S.syncDays=(S.syncDays&&typeof S.syncDays==="object")?S.syncDays:{portal:[2,4],pnc:[]};
  /* suggestion keys he has waved away, so the same nudge doesn't return forever */
  S.dismissedSuggestions=Array.isArray(S.dismissedSuggestions)?S.dismissedSuggestions:[];
  S.lastBriefOn=S.lastBriefOn||"";
  S.stallDays=typeof S.stallDays==="number"?S.stallDays:14;
  S.gateTemplates=(S.gateTemplates&&S.gateTemplates.length)
    ?S.gateTemplates.map(g=>({id:g.id||uid(),name:g.name||"",steps:(g.steps||[]).map(String).filter(Boolean)}))
    :JSON.parse(JSON.stringify(DEF_GATE_TEMPLATES));
  d.tickets=(d.tickets||[]).map(normTicket);
  d.people=(d.people||[]).map(normPerson);
  d.contacts=(d.contacts||[]).map(normContact);
  d.syncs=(d.syncs||[]).map(normSync);
  d.epics=(d.epics||[]).map(normEpic);
  d.patterns=(d.patterns||[]).map(normPattern);
  d.decisions=(d.decisions||[]).map(normDecision);
  d.agenda=(d.agenda||[]).map(normAgenda);
  d.meetings=(d.meetings||[]).map(normMeeting);
  d.capacity=(d.capacity||[]).map(normCapacity);
  d.efforts=(d.efforts||[]).map(normEffort);
  d.forecasts=(d.forecasts||[]).map(normForecast);
  d.approvals=(d.approvals||[]).map(normApproval);
  d.risks=(d.risks||[]).map(normRisk);
  d.incidents=(d.incidents||[]).map(normIncident);
  /* drop links that point at something deleted, in both directions */
  const eids=new Set(d.epics.map(e=>e.id));
  d.tickets.forEach(t=>{if(t.epicId&&!eids.has(t.epicId))t.epicId="";});
  const tids=new Set(d.tickets.map(t=>t.id)),cids=new Set(d.contacts.map(c=>c.id));
  d.patterns.forEach(p=>{p.ticketIds=p.ticketIds.filter(x=>tids.has(x));p.contactIds=p.contactIds.filter(x=>cids.has(x));});
  d.tickets.forEach(t=>{t.contactIds=t.contactIds.filter(x=>cids.has(x));
    /* drop dead blockers and any self-reference a hand-edit could introduce */
    t.blockedBy=t.blockedBy.filter(x=>tids.has(x)&&x!==t.id);});
  /* a decision outlives what it pointed at — keep the record, clear the dead link */
  d.decisions.forEach(x=>{if(x.ticketId&&!tids.has(x.ticketId))x.ticketId="";
    if(x.epicId&&!eids.has(x.epicId))x.epicId="";});
  d.agenda.forEach(a=>{if(a.ticketId&&!tids.has(a.ticketId))a.ticketId="";});
  const mids=new Set(d.meetings.map(m=>m.id)),pids=new Set(d.people.map(x=>x.id));
  d.meetings.forEach(m=>{if(m.epicId&&!eids.has(m.epicId))m.epicId="";
    m.personIds=m.personIds.filter(x=>pids.has(x));m.ticketIds=m.ticketIds.filter(x=>tids.has(x));});
  d.decisions.forEach(x=>{if(x.meetingId&&!mids.has(x.meetingId))x.meetingId="";});
  d.efforts.forEach(e=>{if(e.ticketId&&!tids.has(e.ticketId))e.ticketId="";});
  d.risks.forEach(r=>{r.ticketIds=r.ticketIds.filter(x=>tids.has(x));r.epicIds=r.epicIds.filter(x=>eids.has(x));});
  /* an incident is a historical record — it outlives the demand it happened on */
  d.incidents.forEach(x=>{x.ticketIds=x.ticketIds.filter(t=>tids.has(t));});
  d.approvals.forEach(a=>{if(a.ticketId&&!tids.has(a.ticketId))a.ticketId="";});
  return d;
}

/* ---------- file open / save ---------- */
async function loadFromText(txt,name){
  let parsed;try{parsed=JSON.parse(txt);}catch(e){toast("Not valid JSON",true);return false;}
  if(parsed&&parsed._encrypted){
    while(true){const pw=await promptPassword("🔒 "+(name||"File")+" is encrypted — enter its password");
      if(pw===null)return false;
      try{state=migrate(await decryptEnvelope(parsed,pw));masterPassword=pw;break;}
      catch(e){toast("Wrong password — try again",true);}}
  }else{
    if(!isValidState(migrate(JSON.parse(JSON.stringify(parsed))))){toast("That file isn't a Team Desk data file",true);return false;}
    state=migrate(parsed);masterPassword=null;
  }
  return true;
}
async function openFile(){if(!supportsFS)return importViaInput();
  try{const[h]=await window.showOpenFilePicker({types:[{description:"Team Desk data",accept:{"application/json":[".json"]}}]});
    const f=await h.getFile();if(!await loadFromText(await f.text(),h.name))return;
    fileHandle=h;dirty=false;setFileLabel(h.name);rememberHandle();activeId=activeSyncId=syncFocusId=activeMeetingId=activePersonId=activeEpicId=activePatternId=activeContactId=activeRiskId=activeIncidentId=null;backupLocal();renderApp();toast("Opened "+h.name);
  }catch(e){if(e.name!=="AbortError")toast("Couldn't open: "+e.message,true);}}
function saveGuardOk(action){
  if(!isValidState(state)){toast("Save blocked — data looks corrupted; your file was NOT overwritten.",true);return false;}
  if(hadContent&&contentCount()===0){return confirm("⚠ You're about to "+action+" an EMPTY dataset — every ticket, person, epic and sync record is currently empty.\n\nThis is unusual and may be a mistake. Continue anyway?");}

}
async function saveFile(){if(!supportsFS)return exportDownload();
